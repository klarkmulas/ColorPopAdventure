<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Color Pop Adventure</title>
<style>
:root{
  --bg1:#171831;--bg2:#343b7c;--panel:rgba(255,255,255,.11);--text:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--text);
  background:radial-gradient(circle at top,#535ec2 0%,var(--bg2) 35%,var(--bg1) 100%);
  overflow:hidden;
}
button{font:inherit}
.screen{display:none;width:100vw;height:100vh;overflow:auto}
.screen.active{display:block}
.app{width:min(100vw,480px);min-height:100vh;margin:auto;padding:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.title{font-size:29px;font-weight:1000;letter-spacing:-1px}
.icon-btn,.main-btn{
  border:0;border-radius:16px;background:#fff;color:#2d315f;font-weight:900;cursor:pointer;
  box-shadow:0 7px 18px rgba(0,0,0,.18)
}
.icon-btn{width:46px;height:46px;font-size:20px}
.main-btn{padding:14px 18px}
.panel{
  background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:22px;
  backdrop-filter:blur(8px);box-shadow:0 14px 35px rgba(0,0,0,.18)
}
.hero{padding:20px;text-align:center;margin-bottom:14px}
.hero h1{font-size:40px;margin:0 0 6px}
.hero p{margin:0;opacity:.8}
.progress{margin-top:14px;background:rgba(255,255,255,.13);height:10px;border-radius:99px;overflow:hidden}
.progress > div{height:100%;background:#fff;border-radius:99px;width:0%}
.level-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-bottom:22px}
.level-btn{
  position:relative;aspect-ratio:1;border:0;border-radius:22px;background:rgba(255,255,255,.95);
  color:#303461;font-weight:1000;font-size:22px;cursor:pointer;box-shadow:0 10px 22px rgba(0,0,0,.2)
}
.level-btn.locked{background:rgba(255,255,255,.15);color:rgba(255,255,255,.55)}
.level-btn .stars{position:absolute;left:0;right:0;bottom:7px;font-size:12px;letter-spacing:-1px}
.level-btn .lock{font-size:23px}
.game-app{height:100vh;display:flex;flex-direction:column;gap:10px}
.game-header{display:flex;align-items:center;justify-content:space-between}
.game-title{font-size:24px;font-weight:1000}
.badge{background:var(--panel);padding:8px 12px;border-radius:15px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:17px;padding:9px;text-align:center}
.stat small{display:block;opacity:.72;font-size:11px}
.stat strong{font-size:20px}
.goal{background:rgba(255,255,255,.96);color:#2c315e;border-radius:17px;padding:10px 12px;font-weight:900;text-align:center}
.board-wrap{position:relative;flex:1;min-height:380px;display:flex;align-items:center;justify-content:center}
#board{
  position:relative;width:min(92vw,440px);aspect-ratio:1/1.12;border-radius:26px;padding:10px;
  background:rgba(5,7,25,.34);box-shadow:0 24px 60px rgba(0,0,0,.36),inset 0 0 0 2px rgba(255,255,255,.08);
  touch-action:none;overflow:hidden
}
.ball{
  position:absolute;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 8px 12px rgba(255,255,255,.38),inset 0 -10px 16px rgba(0,0,0,.21),0 5px 10px rgba(0,0,0,.24);
  transition:transform .14s ease,left .22s ease,top .22s ease,opacity .18s ease;cursor:pointer
}
.ball::after{content:"";width:26%;height:18%;border-radius:50%;background:rgba(255,255,255,.55);position:absolute;top:16%;left:22%;transform:rotate(-25deg)}
.ball.selected{transform:scale(1.13);outline:4px solid rgba(255,255,255,.95);z-index:7}
.ball.popping{transform:scale(.1) rotate(45deg);opacity:0}
.ball.special::before{position:absolute;font-size:22px;z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.ball.bomb::before{content:"💣"}
.ball.rocketH::before{content:"↔"}
.ball.rocketV::before{content:"↕"}
.ice{
  position:absolute;border-radius:16px;border:3px solid rgba(210,245,255,.95);
  background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(138,220,255,.25));
  box-shadow:inset 0 0 18px rgba(255,255,255,.65);z-index:2;pointer-events:none
}
#line{position:absolute;inset:0;pointer-events:none;z-index:6}
.toast{
  position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.8);
  background:#fff;color:#282d59;padding:13px 20px;border-radius:18px;font-size:23px;font-weight:1000;
  opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.controls button{border:0;border-radius:17px;padding:12px;font-size:15px;font-weight:900;cursor:pointer}
.controls .secondary{color:#fff;background:var(--panel);border:1px solid rgba(255,255,255,.14)}
.controls .primary{background:#fff;color:#282d59}
.overlay{position:fixed;inset:0;background:rgba(7,8,24,.84);display:none;place-items:center;padding:24px;z-index:100}
.overlay.show{display:grid}
.card{width:min(92vw,400px);background:#fff;color:#282d59;border-radius:28px;padding:28px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.48)}
.card h2{font-size:32px;margin:0 0 8px}
.card p{line-height:1.45}
.result-stars{font-size:42px;letter-spacing:5px;margin:10px 0}
.card button{width:100%;margin-top:9px;border:0;border-radius:17px;padding:14px;font-weight:1000;background:#5964ef;color:#fff;cursor:pointer}
.card button.alt{background:#e9ebff;color:#3c4380}
.legend{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 0;font-size:12px;opacity:.8}
footer{text-align:center;font-size:12px;opacity:.65;padding:8px 0}
</style>
</head>
<body>

<section id="mapScreen" class="screen active">
  <div class="app">
    <div class="topbar">
      <div class="title">Color Pop Adventure</div>
      <button id="soundBtn" class="icon-btn">🔊</button>
    </div>
    <div class="panel hero">
      <h1>🎈</h1>
      <p>Collega i colori, crea potenziamenti e completa tutti i livelli.</p>
      <div class="progress"><div id="progressBar"></div></div>
      <div id="progressText" style="margin-top:8px;font-size:13px;opacity:.78"></div>
      <div class="legend"><span>💣 6 palline</span><span>↔/↕ 8 palline</span></div>
    </div>
    <div id="levelGrid" class="level-grid"></div>
  </div>
</section>

<section id="gameScreen" class="screen">
  <div class="app game-app">
    <div class="game-header">
      <button id="backBtn" class="icon-btn">←</button>
      <div class="game-title">Livello <span id="levelLabel">1</span></div>
      <div class="badge"><span id="objectiveIcon">⭐</span></div>
    </div>

    <div class="stats">
      <div class="stat"><small>Punteggio</small><strong id="score">0</strong></div>
      <div class="stat"><small>Mosse</small><strong id="moves">20</strong></div>
      <div class="stat"><small>Record</small><strong id="best">0</strong></div>
    </div>

    <div id="goal" class="goal"></div>

    <div class="board-wrap">
      <div id="board">
        <svg id="line"></svg>
        <div id="toast" class="toast"></div>
      </div>
    </div>

    <div class="controls">
      <button id="shuffleBtn" class="secondary">🔀 Mescola</button>
      <button id="restartBtn" class="primary">↻ Ricomincia</button>
    </div>
    <footer>Trascina su almeno 2 palline dello stesso colore.</footer>
  </div>
</section>

<div id="resultOverlay" class="overlay">
  <div class="card">
    <h2 id="resultTitle">Livello completato!</h2>
    <div id="resultStars" class="result-stars">⭐⭐⭐</div>
    <p id="resultText"></p>
    <button id="nextBtn">Continua</button>
    <button id="mapBtn" class="alt">Mappa livelli</button>
  </div>
</div>

<script>
const ROWS=8,COLS=7;
const COLORS=['#ff526f','#ffbd3f','#39d5a5','#4b8cff','#a66cff'];
const COLOR_NAMES=['rosse','gialle','verdi','blu','viola'];
const LEVELS=[
 {type:'score',target:700,moves:18},
 {type:'collect',color:0,target:14,moves:18},
 {type:'score',target:1100,moves:18},
 {type:'ice',ice:6,moves:20},
 {type:'collect',color:3,target:20,moves:19},
 {type:'score',target:1600,moves:18},
 {type:'ice',ice:9,moves:19},
 {type:'collect',color:2,target:24,moves:18},
 {type:'score',target:2200,moves:17},
 {type:'ice',ice:12,moves:18},
 {type:'collect',color:4,target:28,moves:17},
 {type:'score',target:2800,moves:17},
 {type:'ice',ice:15,moves:17},
 {type:'collect',color:1,target:32,moves:16},
 {type:'score',target:3400,moves:16},
 {type:'ice',ice:18,moves:16},
 {type:'collect',color:0,target:36,moves:15},
 {type:'score',target:4200,moves:15},
 {type:'ice',ice:21,moves:15},
 {type:'score',target:5200,moves:14}
];

let grid=[],selected=[],dragging=false,lock=false,currentLevel=0,score=0,moves=0,collected=0;
let soundOn=JSON.parse(localStorage.getItem('cp-sound')??'true');
let progress=JSON.parse(localStorage.getItem('cp-progress')||'{"unlocked":1,"stars":{},"best":{}}');

const mapScreen=document.getElementById('mapScreen'),gameScreen=document.getElementById('gameScreen');
const board=document.getElementById('board'),svg=document.getElementById('line');
const scoreEl=document.getElementById('score'),movesEl=document.getElementById('moves'),bestEl=document.getElementById('best');
const goalEl=document.getElementById('goal'),levelLabel=document.getElementById('levelLabel'),objectiveIcon=document.getElementById('objectiveIcon');

function save(){localStorage.setItem('cp-progress',JSON.stringify(progress))}
function beep(freq=440,dur=.07,type='sine',vol=.035){
  if(!soundOn)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(a.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);o.stop(a.currentTime+dur);
  }catch(e){}
}
function renderMap(){
  const gridEl=document.getElementById('levelGrid');gridEl.innerHTML='';
  LEVELS.forEach((lvl,i)=>{
    const b=document.createElement('button'), unlocked=i<progress.unlocked;
    b.className='level-btn'+(unlocked?'':' locked');
    const stars=progress.stars[i]||0;
    b.innerHTML=unlocked?`${i+1}<div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>`:`<span class="lock">🔒</span>`;
    if(unlocked)b.onclick=()=>startLevel(i);
    gridEl.appendChild(b);
  });
  const completed=Object.keys(progress.stars).length;
  document.getElementById('progressBar').style.width=(completed/LEVELS.length*100)+'%';
  document.getElementById('progressText').textContent=`${completed} livelli completati su ${LEVELS.length}`;
  document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';
}
function showScreen(name){
  mapScreen.classList.toggle('active',name==='map');
  gameScreen.classList.toggle('active',name==='game');
}
function startLevel(index){
  currentLevel=index;score=0;collected=0;moves=LEVELS[index].moves;selected=[];lock=false;
  levelLabel.textContent=index+1;
  buildGrid();
  updateUI();
  showScreen('game');
}
function buildGrid(){
  grid=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>({
    color:Math.floor(Math.random()*COLORS.length),special:null,ice:false
  })));
  const lvl=LEVELS[currentLevel];
  if(lvl.type==='ice'){
    const cells=[];
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)cells.push([r,c]);
    cells.sort(()=>Math.random()-.5).slice(0,lvl.ice).forEach(([r,c])=>grid[r][c].ice=true);
  }
  renderBoard();
}
function cellSize(){return (board.clientWidth-20)/COLS}
function pos(r,c){
  const s=cellSize();return{x:10+c*s+s/2,y:10+r*s+s/2,size:s*.78,left:10+c*s+s*.11,top:10+r*s+s*.11}
}
function renderBoard(){
  board.querySelectorAll('.ball,.ice').forEach(e=>e.remove());
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=grid[r][c]; if(!cell)continue;
    const p=pos(r,c),el=document.createElement('div');
    el.className='ball'+(cell.special?' special '+cell.special:'');
    el.dataset.r=r;el.dataset.c=c;
    Object.assign(el.style,{width:p.size+'px',height:p.size+'px',left:p.left+'px',top:p.top+'px',background:COLORS[cell.color]});
    board.appendChild(el);
    if(cell.ice){
      const ice=document.createElement('div');ice.className='ice';
      Object.assign(ice.style,{width:p.size+'px',height:p.size+'px',left:p.left+'px',top:p.top+'px'});
      board.appendChild(ice);
    }
  }
  bindBalls();drawLine();
}
function bindBalls(){
  board.querySelectorAll('.ball').forEach(el=>{
    el.onpointerdown=e=>{if(lock)return;dragging=true;selected=[];el.setPointerCapture(e.pointerId);tryAdd(el)};
    el.onpointerenter=()=>{if(dragging)tryAdd(el)};
    el.onpointermove=e=>{if(!dragging)return;const t=document.elementFromPoint(e.clientX,e.clientY);if(t?.classList.contains('ball'))tryAdd(t)};
    el.onpointerup=finishSelection;el.onpointercancel=finishSelection;
  });
}
function tryAdd(el){
  const r=+el.dataset.r,c=+el.dataset.c;
  if(!selected.length){selected.push({r,c});updateSelected();beep(420,.03);return}
  const last=selected[selected.length-1];
  if(selected.length>1){
    const prev=selected[selected.length-2];
    if(prev.r===r&&prev.c===c){selected.pop();updateSelected();return}
  }
  if(selected.some(x=>x.r===r&&x.c===c))return;
  const same=grid[r][c].color===grid[selected[0].r][selected[0].c].color;
  const near=Math.abs(last.r-r)<=1&&Math.abs(last.c-c)<=1&&(last.r!==r||last.c!==c);
  if(same&&near){selected.push({r,c});updateSelected();beep(430+selected.length*18,.025)}
}
function updateSelected(){
  board.querySelectorAll('.ball').forEach(e=>e.classList.remove('selected'));
  selected.forEach(p=>board.querySelector(`.ball[data-r="${p.r}"][data-c="${p.c}"]`)?.classList.add('selected'));
  drawLine();
}
function drawLine(){
  const pts=selected.map(({r,c})=>{const p=pos(r,c);return`${p.x},${p.y}`}).join(' ');
  svg.setAttribute('viewBox',`0 0 ${board.clientWidth} ${board.clientHeight}`);
  svg.innerHTML=pts?`<polyline points="${pts}" fill="none" stroke="rgba(255,255,255,.94)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`:'';
}
async function finishSelection(){
  if(!dragging)return;dragging=false;
  if(selected.length<2){selected=[];updateSelected();return}
  lock=true;
  const lvl=LEVELS[currentLevel],chain=selected.length,baseColor=grid[selected[0].r][selected[0].c].color;
  const toRemove=new Set(selected.map(p=>p.r+','+p.c));

  // Attiva le palline speciali presenti nella catena
  selected.forEach(({r,c})=>{
    const sp=grid[r][c].special;
    if(sp==='bomb'){
      for(let rr=Math.max(0,r-1);rr<=Math.min(ROWS-1,r+1);rr++)
        for(let cc=Math.max(0,c-1);cc<=Math.min(COLS-1,c+1);cc++)toRemove.add(rr+','+cc);
    }
    if(sp==='rocketH')for(let cc=0;cc<COLS;cc++)toRemove.add(r+','+cc);
    if(sp==='rocketV')for(let rr=0;rr<ROWS;rr++)toRemove.add(rr+','+c);
  });

  const createSpecial=chain>=8?'rocket'+(Math.random()>.5?'H':'V'):chain>=6?'bomb':null;
  const specialColumn=selected[selected.length-1].c;
  const gained=toRemove.size*toRemove.size*8;
  score+=gained;moves--;

  let removedOfColor=0;
  [...toRemove].forEach(key=>{
    const [r,c]=key.split(',').map(Number);
    if(grid[r]?.[c]?.color===lvl.color)removedOfColor++;
  });
  if(lvl.type==='collect')collected+=removedOfColor;

  showToast(chain>=8?`MEGA COMBO +${gained}`:chain>=6?`BOMBA +${gained}`:`+${gained}`);
  beep(chain>=8?780:chain>=6?650:520,.11,'triangle',.06);

  [...toRemove].forEach(key=>{
    const [r,c]=key.split(',').map(Number);
    board.querySelector(`.ball[data-r="${r}"][data-c="${c}"]`)?.classList.add('popping');
  });
  await wait(180);

  [...toRemove].forEach(key=>{
    const [r,c]=key.split(',').map(Number);
    if(grid[r][c].ice)grid[r][c].ice=false;
    grid[r][c]=null;
  });

  collapse();
  if(createSpecial){
    const row=0;
    grid[row][specialColumn].special=createSpecial;
  }
  selected=[];renderBoard();updateUI();
  await wait(240);lock=false;checkEnd();
}
function collapse(){
  for(let c=0;c<COLS;c++){
    const vals=[];
    for(let r=ROWS-1;r>=0;r--)if(grid[r][c])vals.push(grid[r][c]);
    for(let r=ROWS-1,i=0;r>=0;r--,i++){
      grid[r][c]=i<vals.length?vals[i]:{color:Math.floor(Math.random()*COLORS.length),special:null,ice:false};
    }
  }
}
function objectiveMet(){
  const lvl=LEVELS[currentLevel];
  if(lvl.type==='score')return score>=lvl.target;
  if(lvl.type==='collect')return collected>=lvl.target;
  if(lvl.type==='ice')return countIce()===0;
}
function countIce(){
  let n=0;for(const row of grid)for(const cell of row)if(cell?.ice)n++;return n;
}
function updateUI(){
  const lvl=LEVELS[currentLevel];
  scoreEl.textContent=score;movesEl.textContent=moves;
  const best=progress.best[currentLevel]||0;bestEl.textContent=best;
  if(lvl.type==='score'){goalEl.textContent=`Obiettivo: ${lvl.target} punti`;objectiveIcon.textContent='⭐'}
  if(lvl.type==='collect'){goalEl.textContent=`Raccogli ${lvl.target} palline ${COLOR_NAMES[lvl.color]}: ${collected}/${lvl.target}`;objectiveIcon.textContent='🎯'}
  if(lvl.type==='ice'){goalEl.textContent=`Rompi tutto il ghiaccio: ${countIce()} rimasti`;objectiveIcon.textContent='🧊'}
}
function calculateStars(){
  const lvl=LEVELS[currentLevel];
  const base=lvl.type==='score'?lvl.target:Math.max(700,900+currentLevel*140);
  if(score>=base*1.65)return 3;
  if(score>=base*1.25)return 2;
  return 1;
}
function checkEnd(){
  if(objectiveMet())return endLevel(true);
  if(moves<=0)return endLevel(false);
}
function endLevel(win){
  const overlay=document.getElementById('resultOverlay');
  const title=document.getElementById('resultTitle'),text=document.getElementById('resultText');
  const starsEl=document.getElementById('resultStars'),next=document.getElementById('nextBtn');
  if(win){
    const stars=calculateStars();
    title.textContent='Livello completato!';
    starsEl.textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
    text.textContent=`Hai totalizzato ${score} punti.`;
    next.textContent=currentLevel===LEVELS.length-1?'Torna alla mappa':'Livello successivo';
    progress.stars[currentLevel]=Math.max(progress.stars[currentLevel]||0,stars);
    progress.best[currentLevel]=Math.max(progress.best[currentLevel]||0,score);
    progress.unlocked=Math.max(progress.unlocked,Math.min(LEVELS.length,currentLevel+2));
    save();beep(880,.18,'triangle',.07);setTimeout(()=>beep(1100,.2,'triangle',.06),130);
  }else{
    title.textContent='Mosse finite';
    starsEl.textContent='☆☆☆';
    text.textContent='Riprova creando catene più lunghe e usando le palline speciali.';
    next.textContent='Riprova';
    beep(180,.22,'sawtooth',.04);
  }
  next.dataset.win=win?'1':'0';overlay.classList.add('show');
}
function showToast(t){
  const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');
  setTimeout(()=>x.classList.remove('show'),700)
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}

document.getElementById('backBtn').onclick=()=>{showScreen('map');renderMap()};
document.getElementById('restartBtn').onclick=()=>startLevel(currentLevel);
document.getElementById('shuffleBtn').onclick=()=>{
  if(lock||moves<=0)return;
  const flat=grid.flat().sort(()=>Math.random()-.5);
  for(let r=0,i=0;r<ROWS;r++)for(let c=0;c<COLS;c++,i++)grid[r][c]=flat[i];
  moves--;renderBoard();updateUI();checkEnd();beep(350,.08)
};
document.getElementById('soundBtn').onclick=()=>{
  soundOn=!soundOn;localStorage.setItem('cp-sound',JSON.stringify(soundOn));renderMap()
};
document.getElementById('nextBtn').onclick=()=>{
  document.getElementById('resultOverlay').classList.remove('show');
  const win=document.getElementById('nextBtn').dataset.win==='1';
  if(win&&currentLevel<LEVELS.length-1)startLevel(currentLevel+1);
  else if(win){showScreen('map');renderMap()}
  else startLevel(currentLevel)
};
document.getElementById('mapBtn').onclick=()=>{
  document.getElementById('resultOverlay').classList.remove('show');showScreen('map');renderMap()
};
window.addEventListener('resize',()=>{if(gameScreen.classList.contains('active'))renderBoard()});

renderMap();
</script>
</body>
</html>
