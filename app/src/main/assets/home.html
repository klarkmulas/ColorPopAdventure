<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Color Pop Adventure</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:#fff}body{background:radial-gradient(circle at 50% 12%,#ff4de877,transparent 28%),linear-gradient(#16034c,#2c0a7b 48%,#090421)}.home{width:min(100%,480px);height:100%;margin:auto;padding:24px 18px 28px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}.top{width:100%;display:flex;justify-content:flex-end}.sound{width:54px;height:54px;border-radius:50%;border:2px solid #fff9;background:linear-gradient(#8144e6,#2b0a80);color:#fff;font-size:24px}.color{display:flex;justify-content:center;gap:2px}.color span{display:grid;place-items:center;width:55px;height:62px;border-radius:18px;border:2px solid #fff9;font-size:36px;font-weight:900;box-shadow:0 8px 0 #2d0547,inset 0 4px 0 #fff7}.color span:nth-child(1){background:linear-gradient(#ff7888,#e9183c)}.color span:nth-child(2){background:linear-gradient(#ffe765,#ff9d00)}.color span:nth-child(3){background:linear-gradient(#68e6ff,#087ff1)}.color span:nth-child(4){background:linear-gradient(#bfff57,#41bf00)}.color span:nth-child(5){background:linear-gradient(#ff91ed,#cf23c1)}.pop{font-size:92px;line-height:.8;font-weight:900;letter-spacing:-7px;color:#fff7e9;text-shadow:0 9px 0 #743083}.ribbon{display:inline-block;margin-top:7px;padding:8px 25px;border:2px solid #fff9;border-radius:9px 9px 19px 19px;background:linear-gradient(#ef51df,#831ab1);font-size:22px;font-weight:900;box-shadow:0 7px 0 #4b096c}.tagline{max-width:360px;margin:18px auto 0;font-size:18px;font-weight:800;line-height:1.35;color:#fff6c6}.actions{width:100%;display:grid;gap:14px}.play{width:100%;border:2px solid #fff5a1;border-radius:25px;padding:18px;color:#fff;font-size:27px;font-weight:900;background:linear-gradient(#a4f63b,#35b600);box-shadow:0 9px 0 #1d7800}.secondary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.secondary button{border:2px solid #fff8;border-radius:19px;padding:13px 8px;color:#fff;font-size:14px;font-weight:900;background:linear-gradient(#7537d4,#2d0b82);box-shadow:0 6px 0 #17044c}.version{font-size:11px;opacity:.65}.modal{position:fixed;inset:0;display:none;place-items:center;padding:22px;background:#07051dd9;z-index:20}.modal.show{display:grid}.card{width:min(100%,390px);padding:22px;border:2px solid #d989ff;border-radius:26px;background:linear-gradient(#4b1698,#21065e);box-shadow:0 25px 70px #0009}.card h2{margin:0 0 8px;font-size:27px}.card p{margin:0 0 16px;color:#eee4ff}.difficulty{display:grid;gap:10px}.difficulty button{border:2px solid #ffffff80;border-radius:18px;padding:13px;color:#fff;font-size:16px;font-weight:900;background:linear-gradient(#7440d7,#321082)}.difficulty button.selected{border-color:#fff59a;background:linear-gradient(#a6f33e,#39b900);box-shadow:0 0 18px #9cff4d88}.close{width:100%;margin-top:15px;border:0;border-radius:17px;padding:13px;color:#321463;font-size:16px;font-weight:900;background:#fff}</style></head><body><main class="home"><div class="top"><button id="soundBtn" class="sound">🔊</button></div><section><div class="color"><span>C</span><span>O</span><span>L</span><span>O</span><span>R</span></div><div class="pop">POP</div><div class="ribbon">ADVENTURE</div><p class="tagline">Collega i colori, crea combo spettacolari e conquista tutti i livelli!</p></section><section class="actions"><button id="playBtn" class="play">▶ GIOCA</button><div class="secondary"><button id="levelsBtn">🗺️ LIVELLI</button><button id="settingsBtn">⚙️ IMPOSTAZIONI</button></div><div class="secondary"><button id="helpBtn">❓ COME SI GIOCA</button><button id="difficultyBtn">🎯 <span id="difficultyLabel">AUTO</span></button></div><div class="version">Color Pop Adventure 0.63</div></section></main><div id="settingsModal" class="modal"><div class="card"><h2>⚙️ Impostazioni</h2><p>Scegli la difficoltà del gioco. La scelta viene salvata automaticamente.</p><div class="difficulty"><button data-mode="auto">✨ Automatica</button><button data-mode="easy">🟢 Facile</button><button data-mode="normal">🔵 Normale</button><button data-mode="hard">🟣 Difficile</button><button data-mode="expert">🔴 Esperto</button></div><button id="closeSettings" class="close">CHIUDI</button></div></div><script>const s=document.getElementById('soundBtn'),modal=document.getElementById('settingsModal'),label=document.getElementById('difficultyLabel');let on=JSON.parse(localStorage.getItem('cp-sound')??'true');const names={auto:'AUTO',easy:'FACILE',normal:'NORMALE',hard:'DIFFICILE',expert:'ESPERTO'};function currentMode(){return localStorage.getItem('cp-difficulty')||'auto'}function renderDifficulty(){const mode=currentMode();label.textContent=names[mode]||'AUTO';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode))}function r(){s.textContent=on?'🔊':'🔇'}function go(t){if(t)localStorage.removeItem('cp-tutorial-seen');location.href='index.html'}s.onclick=()=>{on=!on;localStorage.setItem('cp-sound',JSON.stringify(on));r()};document.getElementById('playBtn').onclick=()=>go(false);document.getElementById('levelsBtn').onclick=()=>go(false);document.getElementById('helpBtn').onclick=()=>go(true);document.getElementById('settingsBtn').onclick=document.getElementById('difficultyBtn').onclick=()=>{renderDifficulty();modal.classList.add('show')};document.getElementById('closeSettings').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{localStorage.setItem('cp-difficulty',b.dataset.mode);renderDifficulty()});r();renderDifficulty();</script></body></html>
