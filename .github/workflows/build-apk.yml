name: Build Color Pop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        run: gradle --no-daemon assembleDebug

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ColorPopAdventure.apk

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorPopAdventure-APK
          path: ColorPopAdventure.apk
          retention-days: 30
