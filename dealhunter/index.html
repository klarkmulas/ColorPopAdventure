<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealHunter AI</title><style>
:root{--b:#07111f;--p:#0d1b2d;--p2:#10243c;--l:#1e3653;--t:#eff6ff;--m:#8da3bd;--g:#22c55e;--r:#ef4444;--y:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui,Segoe UI,Arial}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:20px 14px;border-right:1px solid var(--l);background:#050e19;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:900;display:flex;gap:9px;align-items:center}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--g),#38bdf8);display:grid;place-items:center;color:#02120a}.tag{margin-left:auto;font-size:10px;padding:4px 7px;border-radius:99px;background:#7bf1a8;color:#001b0e}.nav{display:grid;gap:6px;margin-top:24px}.nav button,.btn{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:11px;padding:10px 12px;font-weight:800;cursor:pointer}.nav button{border:0;background:transparent;text-align:left;color:var(--m)}.nav button.active{background:var(--p2);color:#fff}.main{padding:26px}.top{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px}.title{font-size:30px;font-weight:900}.sub{color:var(--m)}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{border:0;background:linear-gradient(135deg,#16a34a,#0ea5e9)}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(5,1fr);margin-bottom:16px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:16px}.stat,.sec{padding:16px}.lab{color:var(--m);font-size:12px}.val{font-size:24px;font-weight:900;margin-top:5px}.good{color:#65e58c}.bad{color:#ff7c86}.banner{padding:13px 15px;border:1px solid #285948;border-radius:14px;background:#10283d;margin-bottom:16px}.list{display:grid;gap:9px}.deal{display:grid;grid-template-columns:60px 1.7fr repeat(3,.7fr) auto;gap:10px;align-items:center;padding:11px;border:1px solid #203a5a;border-radius:14px;background:#0b1a2c}.pic{width:56px;height:56px;border-radius:10px;background:#07111f;display:grid;place-items:center;font-size:26px;object-fit:cover}.name{font-weight:900}.meta{color:var(--m);font-size:11px;margin-top:3px}.metric b{display:block}.metric span{color:var(--m);font-size:10px}.score{width:43px;height:43px;border:4px solid var(--g);border-radius:50%;display:grid;place-items:center;font-weight:900}.da{display:flex;gap:5px;flex-wrap:wrap}.mini{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:800;text-decoration:none;cursor:pointer}.ebay{background:#173a64}.buy{background:#103b27}.two{grid-template-columns:1.25fr .75fr}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #1a314c}.empty{padding:30px;text-align:center;color:var(--m)}.field{display:grid;gap:5px;margin-bottom:10px}.field input{background:#081827;color:#fff;border:1px solid var(--l);border-radius:10px;padding:10px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{width:min(580px,100%);background:var(--p);border:1px solid #294866;border-radius:16px;padding:18px}.toast{position:fixed;right:18px;bottom:18px;background:var(--p2);border:1px solid #2f5479;padding:11px 13px;border-radius:11px;display:none}.toast.show{display:block}.bottom{display:none}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.deal{grid-template-columns:56px 1fr auto}.metric{display:none}.two{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}.side{display:none}.main{padding:16px 12px 82px}.top{display:block}.actions{margin-top:12px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#050e19;border-top:1px solid var(--l);padding:7px}.bottom button{border:0;background:transparent;color:var(--m);font-size:10px}.bottom button.active{color:#fff}.deal .da{grid-column:1/-1}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">⌁</div>DealHunter AI <span id="tag" class="tag">DEMO</span></div><div id="nav" class="nav"></div></aside><main class="main"><div id="view"></div></main></div><div id="bottom" class="bottom"></div>
<div id="connect" class="modal"><div class="box"><h3>Collega eBay LIVE</h3><p class="sub">Incolla solo un Application Access Token temporaneo. Non inserire Client Secret.</p><div class="field"><label>Token</label><input id="tok" type="password"></div><div class="actions"><button class="btn primary" onclick="goLive()">Connetti</button><button class="btn" onclick="closeLive()">Annulla</button></div></div></div>
<div id="sell" class="modal"><div class="box"><h3>Simula vendita</h3><div class="field"><label>Prezzo vendita</label><input id="sp" type="number"></div><div class="field"><label>Costi</label><input id="sc" type="number" value="15"></div><div class="actions"><button class="btn primary" onclick="confirmSale()">Conferma</button><button class="btn" onclick="closeSale()">Annulla</button></div></div></div><div id="toast" class="toast"></div>
<script>
'use strict';
const P=[['iPhone 13 128GB','Smartphone',335,248,8,94],['PlayStation 5 Slim Disc','Console',385,292,12,93],['Nintendo Switch OLED','Console',250,185,9,90],['RTX 4070 12GB','GPU',485,359,11,86],['MacBook Air M1 256GB','Notebook',545,419,14,89],['Sony A6400 body','Fotocamere',575,435,10,78],['iPhone 12 128GB','Smartphone',285,214,7,92],['Steam Deck OLED 512GB','Console',515,399,13,84]];
const D={capital:500,cash:500,profit:0,portfolio:[],history:[],seed:1,minScore:55};let s=load(),page='home',live=false,token='',liveItems=[],selling=null;
function load(){try{return Object.assign(JSON.parse(JSON.stringify(D)),JSON.parse(localStorage.getItem('dh121')||'{}'))}catch(e){return JSON.parse(JSON.stringify(D))}}function save(){localStorage.setItem('dh121',JSON.stringify(s))}function euro(v){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0)}function search(n){return'https://www.ebay.it/sch/i.html?_nkw='+encodeURIComponent(n)}function icon(c){return({Smartphone:'📱',Console:'🎮',GPU:'🖥️',Notebook:'💻',Fotocamere:'📷'})[c]||'📦'}
function demo(){return P.map((x,i)=>{let ask=x[3]+(((s.seed*(i+3)*17)%13)-6),ship=x[4],tot=ask+ship,resale=Math.round(x[2]*.94),profit=resale-tot-Math.max(10,Math.round(resale*.04)),roi=profit/tot*100,score=Math.max(0,Math.min(100,Math.round(55+roi*.9+x[5]*.2)));return{id:'d'+i,n:x[0],c:x[1],ask,ship,total:tot,resale,profit,roi,score,url:search(x[0]),img:'',seller:'DEMO',real:false}}).sort((a,b)=>b.score-a.score)}function deals(){return live&&liveItems.length?liveItems:demo()}function ok(){return deals().filter(x=>x.score>=s.minScore&&x.profit>0)}
function nav(){let n=[['home','⌂ Home'],['deals','◎ Occasioni'],['portfolio','▣ Portafoglio'],['history','↻ Storico'],['settings','⚙ Impostazioni']];document.getElementById('nav').innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');document.getElementById('bottom').innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');document.getElementById('tag').textContent=live?'LIVE':'DEMO';document.getElementById('tag').style.background=live?'#ff7b72':'#7bf1a8'}function go(p){page=p;render()}function head(t,sub){return`<div class="top"><div><div class="title">${t}</div><div class="sub">${sub}</div></div><div class="actions">${live?'<button class="btn" onclick="offLive()">Torna DEMO</button>':'<button class="btn" onclick="openLive()">Collega eBay LIVE</button>'}<button class="btn primary" onclick="scan()">Aggiorna</button></div></div>`}function stats(){return`<div class="grid stats"><div class="card stat"><div class="lab">Liquidità</div><div class="val">${euro(s.cash)}</div></div><div class="card stat"><div class="lab">Profitto</div><div class="val ${s.profit>=0?'good':'bad'}">${euro(s.profit)}</div></div><div class="card stat"><div class="lab">ROI</div><div class="val good">${(s.profit/s.capital*100).toFixed(1)}%</div></div><div class="card stat"><div class="lab">Portafoglio</div><div class="val">${s.portfolio.length}</div></div><div class="card stat"><div class="lab">Affari validi</div><div class="val">${ok().length}</div></div></div>`}
function card(x,compact=false){let pic=x.img?`<img class="pic" src="${x.img}">`:`<div class="pic">${icon(x.c)}</div>`;return`<div class="deal">${pic}<div><div class="name">${x.n}</div><div class="meta">${x.c} · ${x.real?'ANNUNCIO REALE':'DEMO'} ${x.seller?('· '+x.seller):''}</div></div>${compact?'':`<div class="metric"><b>${euro(x.total)}</b><span>costo</span></div><div class="metric"><b>${euro(x.resale)}</b><span>rivendita</span></div><div class="metric"><b class="good">${euro(x.profit)}</b><span>profitto</span></div>`}<div class="score">${x.score}</div><div class="da"><a class="mini ebay" href="${x.url}" target="_blank" rel="noopener">${x.real?'Vedi annuncio':'Cerca su eBay'}</a><button class="mini buy" onclick="buy('${x.id}')">Simula acquisto</button></div></div>`}
function home(){let a=ok().slice(0,5);document.getElementById('view').innerHTML=head('Dashboard','Occasioni eBay + simulazione, senza acquisti automatici.')+`<div class="banner"><b>${live?'eBay LIVE':'DEMO'}</b> — ${live?'foto, prezzo e link provengono dagli annunci restituiti da eBay.':'il pulsante Cerca su eBay apre risultati reali.'}</div>`+stats()+`<div class="grid two"><section class="card sec"><h3>🔥 Top occasioni</h3><div class="list">${a.length?a.map(x=>card(x,true)).join(''):'<div class="empty">Nessuna occasione.</div>'}</div></section><section class="card sec"><h3>Come usarlo</h3><div class="row"><span>1</span><b>Apri eBay</b></div><div class="row"><span>2</span><b>Controlla annuncio</b></div><div class="row"><span>3</span><b>Simula acquisto</b></div></section></div>`}function opportunities(){document.getElementById('view').innerHTML=head('Occasioni',live?'Annunci reali restituiti dalla Browse API eBay.':'Dati demo con ricerca reale su eBay.')+`<div class="card sec"><div class="list">${deals().map(x=>card(x)).join('')}</div></div>`}
function portfolio(){document.getElementById('view').innerHTML=head('Portafoglio','Solo acquisti virtuali.')+stats()+`<div class="grid">${s.portfolio.length?s.portfolio.map(x=>`<div class="card sec"><b>${x.n}</b><div class="row"><span>Costo</span><b>${euro(x.total)}</b></div><div class="row"><span>Rivendita stimata</span><b>${euro(x.resale)}</b></div><div class="actions" style="margin-top:10px"><a class="btn" href="${x.url}" target="_blank">Apri eBay</a><button class="btn primary" onclick="sellOpen('${x.id}')">Simula vendita</button></div></div>`).join(''):'<div class="card empty">Portafoglio vuoto.</div>'}</div>`}function history(){document.getElementById('view').innerHTML=head('Storico','Operazioni simulate salvate nel browser.')+`<div class="card sec">${s.history.length?s.history.slice().reverse().map(h=>`<div class="row"><span>${h.type} · ${h.n}</span><b>${h.type==='Vendita'?euro(h.profit):euro(h.amount)}</b></div>`).join(''):'<div class="empty">Nessuna operazione.</div>'}</div>`}function settings(){document.getElementById('view').innerHTML=head('Impostazioni','Parametri della simulazione.')+`<div class="card sec"><div class="field"><label>Capitale iniziale</label><input id="cap" type="number" value="${s.capital}"></div><div class="field"><label>Deal Score minimo</label><input id="ms" type="number" value="${s.minScore}"></div><button class="btn primary" onclick="saveSet()">Salva</button></div>`}
function render(){nav();({home,deals:opportunities,portfolio,history,settings}[page]||home)()}function scan(){if(live)return ebay();s.seed++;save();render();toastMsg('Scansione demo aggiornata')}function buy(id){let x=deals().find(z=>z.id===id);if(!x)return;if(s.portfolio.some(z=>z.id===id))return toastMsg('Già nel portafoglio');if(x.total>s.cash)return toastMsg('Liquidità insufficiente');s.cash-=x.total;s.portfolio.push(x);s.history.push({type:'Acquisto',n:x.n,amount:x.total});save();render();toastMsg('Acquisto virtuale registrato')}function sellOpen(id){selling=id;let x=s.portfolio.find(z=>z.id===id);sp.value=x.resale;sc.value=15;sell.classList.add('show')}function closeSale(){sell.classList.remove('show')}function confirmSale(){let x=s.portfolio.find(z=>z.id===selling),p=+sp.value,c=+sc.value,pr=p-c-x.total;s.cash+=p-c;s.profit+=pr;s.history.push({type:'Vendita',n:x.n,profit:pr});s.portfolio=s.portfolio.filter(z=>z.id!==selling);save();closeSale();render();toastMsg('Vendita simulata: '+euro(pr))}function saveSet(){let old=s.capital;s.capital=+cap.value||500;s.cash+=s.capital-old;s.minScore=+ms.value||0;save();render()}function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
function openLive(){connect.classList.add('show')}function closeLive(){connect.classList.remove('show')}async function goLive(){token=tok.value.trim();if(!token)return toastMsg('Inserisci il token');closeLive();await ebay()}function offLive(){live=false;liveItems=[];token='';render()}async function ebay(){if(!token)return openLive();toastMsg('Ricerca eBay…');try{let qs=['iPhone 13 128GB','PlayStation 5 Slim Disc','Nintendo Switch OLED','RTX 4070','MacBook Air M1'],out=[];for(const q of qs){let r=await fetch('https://api.ebay.com/buy/browse/v1/item_summary/search?q='+encodeURIComponent(q)+'&limit=5&filter=buyingOptions:{FIXED_PRICE}',{headers:{Authorization:'Bearer '+token,'X-EBAY-C-MARKETPLACE-ID':'EBAY_IT'}});if(!r.ok)throw Error(r.status);let j=await r.json();for(const it of(j.itemSummaries||[])){let price=+(it.price?.value||0);if(!price)continue;let ship=+(it.shippingOptions?.[0]?.shippingCost?.value||0),tot=price+ship,resale=Math.round(tot*1.12),profit=resale-tot-Math.max(10,resale*.04),roi=profit/tot*100,score=Math.round(Math.max(0,Math.min(100,60+roi)));out.push({id:'e'+String(it.itemId||Math.random()).replace(/\W/g,''),n:it.title||q,c:guess(it.title||q),ask:price,ship,total:tot,resale,profit,roi,score,url:it.itemWebUrl||search(q),img:it.image?.imageUrl||'',seller:it.seller?.username||'eBay',real:true})}}if(!out.length)throw Error('vuoto');liveItems=out.sort((a,b)=>b.score-a.score);live=true;render();toastMsg('eBay LIVE attivo')}catch(e){console.error(e);live=false;liveItems=[];render();alert('La chiamata diretta all API eBay è stata bloccata o rifiutata dal browser. La DEMO continua a funzionare; per il LIVE stabile serve un piccolo backend sicuro.')}}function guess(n){n=n.toLowerCase();if(/iphone|samsung|pixel/.test(n))return'Smartphone';if(/playstation|switch|xbox|steam/.test(n))return'Console';if(/rtx|radeon|geforce/.test(n))return'GPU';if(/macbook|laptop|notebook|thinkpad/.test(n))return'Notebook';return'Fotocamere'}
window.onerror=(m)=>{console.error(m);return false};render();
</script></body></html>
