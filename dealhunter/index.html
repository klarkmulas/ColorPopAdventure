<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>DealHunter AI — Demo</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#10243c;--line:#1e3653;--txt:#eff6ff;--muted:#8da3bd;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--blue:#38bdf8;--violet:#8b5cf6;--shadow:0 18px 45px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#06101d,#081522 45%,#07111f);color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:rgba(5,14,25,.94);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;letter-spacing:-.03em;margin:2px 6px 22px}.brandmark{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center;color:#04130b;font-size:21px;box-shadow:0 10px 28px rgba(34,197,94,.22)}.demo-tag{font-size:10px;color:#001b0e;background:#7bf1a8;padding:3px 6px;border-radius:999px;margin-left:auto}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active{background:#10243c;color:#fff}.sidefoot{position:absolute;bottom:20px;left:16px;right:16px;color:var(--muted);font-size:12px;line-height:1.45}.main{min-width:0;padding:28px 30px 90px}.topbar{display:flex;align-items:flex-start;gap:18px;justify-content:space-between;margin-bottom:24px}.eyebrow{font-size:12px;color:var(--green);font-weight:900;text-transform:uppercase;letter-spacing:.12em}.title{font-size:30px;font-weight:900;letter-spacing:-.04em;margin:4px 0 4px}.subtitle{color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#10243c;color:#fff;padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.12)}.btn.primary{background:linear-gradient(135deg,#16a34a,#0ea5e9);border:0}.btn.ghost{background:transparent}.btn.danger{background:#3a1217;border-color:#64212a}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:18px}.card{background:linear-gradient(180deg,rgba(16,36,60,.95),rgba(10,27,45,.96));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:18px}.stat .label{color:var(--muted);font-size:12px;font-weight:700}.stat .value{font-size:25px;font-weight:900;margin-top:6px;letter-spacing:-.04em}.stat .small{font-size:11px;color:var(--muted);margin-top:5px}.good{color:#65e58c!important}.bad{color:#ff7c86!important}.warn{color:#ffc55d!important}.two{grid-template-columns:1.3fr .7fr}.section{padding:18px}.section h3{margin:0 0 14px;font-size:17px}.list{display:grid;gap:10px}.deal{display:grid;grid-template-columns:1.7fr repeat(5,.7fr) auto;gap:10px;align-items:center;padding:13px 14px;border:1px solid #203a5a;border-radius:15px;background:#0b1a2c}.deal:hover{border-color:#315780}.pname{font-weight:900;font-size:14px}.cat{color:var(--muted);font-size:11px;margin-top:3px}.metric b{display:block;font-size:13px}.metric span{font-size:10px;color:var(--muted)}.score{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;border:4px solid #1e3a54;background:#091827}.score.high{border-color:var(--green)}.score.mid{border-color:var(--yellow)}.score.low{border-color:var(--red)}.risk{font-weight:900}.risk.low{color:#65e58c}.risk.med{color:#ffc55d}.risk.high{color:#ff7c86}.deal-actions{display:flex;gap:6px}.mini{padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:#10243c;color:#fff;font-size:11px;font-weight:800;cursor:pointer}.mini.buy{background:#103b27;border-color:#1e6d46}.mini.sell{background:#123e55;border-color:#1b6e93}.strategy{display:grid;gap:10px}.strategy-row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #1a324f;padding:9px 0}.strategy-row:last-child{border:0}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:#102b42;border:1px solid #224868;color:#a8c6e3;font-size:10px;font-weight:800}.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:16px;background:linear-gradient(90deg,#172b20,#10283d);border:1px solid #285948;border-radius:15px;color:#dfffea}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select{background:#081827;color:#fff;border:1px solid #203b5b;border-radius:11px;padding:10px 11px;outline:0}.toolbar input{min-width:240px}.portfolio{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:16px}.item .top{display:flex;justify-content:space-between;gap:10px}.item h4{margin:0;font-size:15px}.item p{color:var(--muted);font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;margin-top:9px;font-size:12px}.row b{font-size:13px}.empty{padding:40px;text-align:center;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:11px;border-bottom:1px solid #1a314c}th{color:#8fa9c6;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.settings{grid-template-columns:repeat(2,minmax(0,1fr))}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);font-weight:700}.checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{display:flex;align-items:center;gap:8px;background:#0a1a2b;border:1px solid #203a58;padding:9px;border-radius:10px}.bottomnav{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.64);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.show{display:flex}.modalbox{width:min(520px,100%);background:#0d1e32;border:1px solid #294866;border-radius:18px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5)}.modalbox h3{margin-top:0}.modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{color:var(--muted);font-size:11px;line-height:1.5}.toast{position:fixed;right:20px;bottom:20px;background:#10243c;border:1px solid #2f5479;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:50;box-shadow:var(--shadow)}.toast.show{display:block}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.deal{grid-template-columns:1.6fr repeat(3,.75fr) auto}.hide-md{display:none}.two{grid-template-columns:1fr}.portfolio{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{display:block}.sidebar{display:none}.main{padding:18px 14px 94px}.topbar{display:block}.actions{margin-top:14px}.title{font-size:26px}.stats{grid-template-columns:repeat(2,1fr)}.deal{grid-template-columns:1fr auto}.deal .metric{display:none}.deal-actions{grid-column:1/-1}.portfolio,.settings{grid-template-columns:1fr}.bottomnav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(5,14,25,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 5px max(8px,env(safe-area-inset-bottom))}.bottomnav button{border:0;background:transparent;color:#7890aa;font-size:10px;font-weight:800;padding:7px 2px}.bottomnav button.active{color:#fff}.bottomnav b{display:block;font-size:17px;margin-bottom:2px}.modalgrid{grid-template-columns:1fr}.toolbar input{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">⌁</div>DealHunter AI <span class="demo-tag">DEMO</span></div>
  <nav class="nav" id="desktopNav"></nav>
  <div class="sidefoot">Simulatore browser-only.<br>Nessun acquisto reale, nessuna credenziale personale.</div>
</aside>
<main class="main">
  <div id="view"></div>
</main>
</div>
<nav class="bottomnav" id="bottomNav"></nav>
<div class="modal" id="sellModal"><div class="modalbox">
  <h3>Simula vendita</h3>
  <p class="notice" id="sellName"></p>
  <div class="modalgrid">
    <div class="field"><label>Prezzo vendita (€)</label><input id="sellPrice" type="number" step="1"></div>
    <div class="field"><label>Costi totali (€)</label><input id="sellCosts" type="number" step="1" value="15"></div>
  </div>
  <div class="actions"><button class="btn primary" onclick="confirmSale()">Conferma vendita</button><button class="btn ghost" onclick="closeSale()">Annulla</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const PRODUCTS=[
{n:'iPhone 13 128GB',c:'Smartphone',base:335,ask:248,ship:8,liq:94,seller:88,desc:90,photos:85},
{n:'PlayStation 5 Slim Disc',c:'Console',base:385,ask:292,ship:12,liq:93,seller:95,desc:84,photos:92},
{n:'Nintendo Switch OLED',c:'Console',base:250,ask:185,ship:9,liq:90,seller:83,desc:91,photos:88},
{n:'RTX 4070 12GB',c:'GPU',base:485,ask:359,ship:11,liq:86,seller:91,desc:78,photos:82},
{n:'MacBook Air M1 256GB',c:'Notebook',base:545,ask:419,ship:14,liq:89,seller:97,desc:88,photos:93},
{n:'Sony A6400 body',c:'Fotocamere',base:575,ask:435,ship:10,liq:78,seller:89,desc:81,photos:91},
{n:'iPhone 12 128GB',c:'Smartphone',base:285,ask:214,ship:7,liq:92,seller:80,desc:76,photos:78},
{n:'Steam Deck OLED 512GB',c:'Console',base:515,ask:399,ship:13,liq:84,seller:92,desc:90,photos:88},
{n:'RTX 3060 Ti',c:'GPU',base:245,ask:174,ship:10,liq:82,seller:74,desc:69,photos:73},
{n:'Lenovo ThinkPad T14 Gen 2',c:'Notebook',base:395,ask:285,ship:12,liq:70,seller:93,desc:87,photos:80},
{n:'Canon EOS R50 kit',c:'Fotocamere',base:590,ask:448,ship:11,liq:76,seller:90,desc:84,photos:87},
{n:'Samsung S23 256GB',c:'Smartphone',base:405,ask:308,ship:8,liq:88,seller:86,desc:82,photos:89}
];
const DEFAULT={capitalStart:500,cash:500,realized:0,portfolio:[],history:[],discarded:[],settings:{minProfit:30,minRoi:10,minScore:60,maxPrice:500,cats:['Smartphone','Console','GPU','Notebook','Fotocamere']},scanSeed:1};
let state=load();let page='home';let sellingId=null;
function load(){try{const x=JSON.parse(localStorage.getItem('dealhunter_v1'));return Object.assign(structuredClone(DEFAULT),x)}catch(e){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem('dealhunter_v1',JSON.stringify(state))}
function euro(v){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0)}
function pct(v){return (v>=0?'+':'')+(v||0).toFixed(1)+'%'}
function idFor(p,i){return p.n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+i}
function currentDeals(){return PRODUCTS.map((p,i)=>{const jitter=((state.scanSeed*(i+3)*17)%13)-6;const ask=Math.max(40,p.ask+jitter);const total=ask+p.ship;const resale=Math.round(p.base*.94);const profit=resale-total-Math.max(10,Math.round(resale*.04));const roi=profit/total*100;const discount=(p.base-total)/p.base*100;const anomaly=Math.max(0,discount-32);const risk=Math.round(Math.min(95,100-(p.seller*.38+p.desc*.22+p.photos*.18)+anomaly*1.15));let score=Math.round(Math.max(0,Math.min(100,discount*1.25+roi*.8+p.liq*.34-risk*.36)));return {...p,id:idFor(p,i),ask,total,resale,profit,roi,discount,risk,score}}).filter(d=>state.settings.cats.includes(d.c)&&d.total<=state.settings.maxPrice&&!state.discarded.includes(d.id)).sort((a,b)=>b.score-a.score)}
function eligible(){return currentDeals().filter(d=>d.profit>=state.settings.minProfit&&d.roi>=state.settings.minRoi&&d.score>=state.settings.minScore)}
function strategy(){const ds=eligible().filter(d=>d.risk<55).slice(0,10);let best={profit:0,cost:0,items:[]};for(let mask=1;mask<(1<<ds.length);mask++){let cost=0,profit=0,items=[];for(let i=0;i<ds.length;i++)if(mask&(1<<i)){cost+=ds[i].total;profit+=ds[i].profit;items.push(ds[i])}if(cost<=state.cash&&profit>best.profit)best={profit,cost,items}}return best}
function roiTotal(){const invested=state.portfolio.reduce((s,x)=>s+x.total,0);return state.capitalStart?state.realized/state.capitalStart*100:0}
function nav(){const n=[['home','⌂','Home'],['deals','◎','Occasioni'],['portfolio','▣','Portafoglio'],['history','↻','Storico'],['settings','⚙','Impostazioni']];desktopNav.innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('');bottomNav.innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}
function go(p){page=p;render()}
function header(title,sub,extra=''){return `<div class="topbar"><div><div class="eyebrow">DealHunter AI · dati simulati</div><div class="title">${title}</div><div class="subtitle">${sub}</div></div><div class="actions">${extra}</div></div>`}
function stats(){return `<div class="grid stats">
<div class="card stat"><div class="label">Liquidità</div><div class="value">${euro(state.cash)}</div><div class="small">su ${euro(state.capitalStart)} iniziali</div></div>
<div class="card stat"><div class="label">Profitto realizzato</div><div class="value ${state.realized>=0?'good':'bad'}">${euro(state.realized)}</div><div class="small">vendite simulate</div></div>
<div class="card stat"><div class="label">ROI totale</div><div class="value ${roiTotal()>=0?'good':'bad'}">${pct(roiTotal())}</div><div class="small">sul capitale iniziale</div></div>
<div class="card stat"><div class="label">In portafoglio</div><div class="value">${state.portfolio.length}</div><div class="small">oggetti virtuali</div></div>
<div class="card stat"><div class="label">Affari validi</div><div class="value">${eligible().length}</div><div class="small">secondo i filtri</div></div></div>`}
function dealHtml(d,compact=false){const risk=d.risk<35?'low':d.risk<60?'med':'high',sc=d.score>=80?'high':d.score>=65?'mid':'low';return `<div class="deal"><div><div class="pname">${d.n}</div><div class="cat">${d.c} · mercato attivo demo ${euro(d.base)}</div></div>${compact?'':`<div class="metric"><b>${euro(d.total)}</b><span>costo totale</span></div><div class="metric"><b>${euro(d.resale)}</b><span>rivendita prudente</span></div><div class="metric"><b class="good">${euro(d.profit)}</b><span>profitto stimato</span></div><div class="metric hide-md"><b class="good">${pct(d.roi)}</b><span>ROI</span></div><div class="metric hide-md"><b class="risk ${risk}">${d.risk}/100</b><span>rischio</span></div>`}<div class="score ${sc}">${d.score}</div><div class="deal-actions"><button class="mini buy" onclick="buy('${d.id}')">Simula acquisto</button><button class="mini" onclick="discard('${d.id}')">Scarta</button></div></div>`}
function home(){const ds=eligible().slice(0,5),s=strategy();view.innerHTML=header('Dashboard','Trova, valuta e simula le migliori occasioni senza usare denaro reale.',`<button class="btn primary" onclick="scan()">Nuova scansione demo</button>`)+`<div class="banner"><span class="dot"></span><div><b>Modalità simulazione attiva</b><div class="notice">Nessuna transazione reale. Prezzi, venditori e metriche sono dati dimostrativi.</div></div></div>`+stats()+`<div class="grid two"><section class="card section"><h3>🔥 Top occasioni</h3><div class="list">${ds.length?ds.map(d=>dealHtml(d,true)).join(''):'<div class="empty">Nessuna occasione supera i filtri attuali.</div>'}</div></section><section class="card section"><h3>Strategia capitale</h3><div class="strategy">${s.items.length?s.items.map(x=>`<div class="strategy-row"><span>${x.n}</span><b>${euro(x.total)}</b></div>`).join(''):`<div class="empty">Nessuna combinazione compatibile con la liquidità.</div>`}<div class="strategy-row"><span>Capitale impegnato</span><b>${euro(s.cost)}</b></div><div class="strategy-row"><span>Profitto potenziale</span><b class="good">${euro(s.profit)}</b></div><div class="strategy-row"><span>Liquidità residua</span><b>${euro(state.cash-s.cost)}</b></div></div><p class="notice">Ottimizzazione demo: massimizza il profitto stimato entro la liquidità, escludendo occasioni ad alto rischio.</p></section></div>`}
function deals(){const ds=currentDeals();view.innerHTML=header('Occasioni','Classifica demo ordinata per Deal Score.',`<button class="btn primary" onclick="scan()">Aggiorna scansione</button>`)+`<div class="toolbar"><input id="q" placeholder="Cerca prodotto..." oninput="filterDeals()"><span class="pill">Score ≥ ${state.settings.minScore}</span><span class="pill">ROI ≥ ${state.settings.minRoi}%</span><span class="pill">Profitto ≥ ${euro(state.settings.minProfit)}</span></div><div class="card section"><div class="list" id="dealList">${ds.map(d=>dealHtml(d)).join('')}</div></div>`}
function filterDeals(){const q=document.getElementById('q').value.toLowerCase();document.querySelectorAll('#dealList .deal').forEach(el=>el.style.display=el.innerText.toLowerCase().includes(q)?'grid':'none')}
function portfolio(){view.innerHTML=header('Portafoglio','Oggetti acquistati virtualmente e capitale impegnato.')+stats()+`<div class="grid portfolio">${state.portfolio.length?state.portfolio.map(x=>`<article class="card item"><div class="top"><div><h4>${x.n}</h4><p>${x.c}</p></div><span class="pill">Score ${x.score}</span></div><div class="row"><span>Costo acquisto</span><b>${euro(x.total)}</b></div><div class="row"><span>Valore prudente</span><b>${euro(x.resale)}</b></div><div class="row"><span>Profitto stimato</span><b class="good">${euro(x.profit)}</b></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="openSale('${x.id}')">Simula vendita</button></div></article>`).join(''):'<div class="card empty">Nessun oggetto nel portafoglio. Vai su Occasioni e simula un acquisto.</div>'}</div>`}
function history(){const rows=[...state.history].reverse();view.innerHTML=header('Storico','Tutte le operazioni simulate registrate nel browser.')+`<div class="card section">${rows.length?`<table><thead><tr><th>Tipo</th><th>Prodotto</th><th>Categoria</th><th>Importo</th><th>Profitto</th><th>Data</th></tr></thead><tbody>${rows.map(h=>`<tr><td>${h.type}</td><td><b>${h.n}</b></td><td>${h.c}</td><td>${euro(h.amount)}</td><td class="${h.profit>=0?'good':'bad'}">${h.type==='Vendita'?euro(h.profit):'—'}</td><td>${h.date}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Lo storico è ancora vuoto.</div>'}</div>`}
function settings(){const s=state.settings,cats=['Smartphone','Console','GPU','Notebook','Fotocamere'];view.innerHTML=header('Impostazioni','Regola la strategia della simulazione.',`<button class="btn danger" onclick="resetDemo()">Reset demo</button>`)+`<div class="grid settings"><section class="card section"><h3>Capitale e filtri</h3><div class="field"><label>Capitale iniziale (€)</label><input id="capitalStart" type="number" value="${state.capitalStart}"></div><div class="field"><label>Profitto minimo (€)</label><input id="minProfit" type="number" value="${s.minProfit}"></div><div class="field"><label>ROI minimo (%)</label><input id="minRoi" type="number" value="${s.minRoi}"></div><div class="field"><label>Deal Score minimo</label><input id="minScore" type="number" min="0" max="100" value="${s.minScore}"></div><div class="field"><label>Prezzo massimo (€)</label><input id="maxPrice" type="number" value="${s.maxPrice}"></div><button class="btn primary" onclick="saveSettings()">Salva impostazioni</button></section><section class="card section"><h3>Categorie attive</h3><div class="checkgrid">${cats.map(c=>`<label class="check"><input type="checkbox" value="${c}" ${s.cats.includes(c)?'checked':''}>${c}</label>`).join('')}</div><p class="notice" style="margin-top:16px">Questa V1 usa solo dati simulati. L'architettura è predisposta per una futura integrazione con API ufficiali, senza scraping non autorizzato.</p></section></div>`}
function render(){nav();({home,deals,portfolio,history,settings}[page]||home)()}
function scan(){state.scanSeed=(state.scanSeed||1)+1;save();toast('Scansione demo aggiornata');render()}
function buy(id){const d=currentDeals().find(x=>x.id===id);if(!d)return;if(state.portfolio.some(x=>x.id===id))return toast('Già nel portafoglio');if(d.total>state.cash)return toast('Liquidità insufficiente');state.cash-=d.total;state.portfolio.push({...d,boughtAt:new Date().toLocaleString('it-IT')});state.history.push({type:'Acquisto',n:d.n,c:d.c,amount:d.total,profit:0,date:new Date().toLocaleString('it-IT')});save();toast('Acquisto virtuale registrato');render()}
function discard(id){if(!state.discarded.includes(id))state.discarded.push(id);save();toast('Occasione scartata');render()}
function openSale(id){const x=state.portfolio.find(p=>p.id===id);if(!x)return;sellingId=id;sellName.textContent=x.n+' · acquistato virtualmente a '+euro(x.total);sellPrice.value=x.resale;sellCosts.value=Math.max(10,Math.round(x.resale*.04));sellModal.classList.add('show')}
function closeSale(){sellModal.classList.remove('show');sellingId=null}
function confirmSale(){const x=state.portfolio.find(p=>p.id===sellingId);if(!x)return;const price=Number(sellPrice.value||0),costs=Number(sellCosts.value||0);if(price<=0)return toast('Inserisci un prezzo valido');const profit=price-costs-x.total;state.cash+=price-costs;state.realized+=profit;state.history.push({type:'Vendita',n:x.n,c:x.c,amount:price,profit,date:new Date().toLocaleString('it-IT')});state.portfolio=state.portfolio.filter(p=>p.id!==sellingId);save();closeSale();toast('Vendita virtuale registrata: '+euro(profit));render()}
function saveSettings(){const old=state.capitalStart,newCap=Number(capitalStart.value||500);state.cash+=newCap-old;state.capitalStart=newCap;state.settings.minProfit=Number(minProfit.value||0);state.settings.minRoi=Number(minRoi.value||0);state.settings.minScore=Number(minScore.value||0);state.settings.maxPrice=Number(maxPrice.value||99999);state.settings.cats=[...document.querySelectorAll('.check input:checked')].map(x=>x.value);save();toast('Impostazioni salvate');render()}
function resetDemo(){if(!confirm('Azzerare tutta la demo e tornare a 500 €?'))return;state=structuredClone(DEFAULT);save();toast('Demo azzerata');render()}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),2200)}
render();
</script>
</body>
</html>
