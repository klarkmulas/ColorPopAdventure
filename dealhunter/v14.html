<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealHunter AI V1.5</title><style>:root{--b:#07111f;--p:#0d1b2d;--p2:#10243c;--l:#1e3653;--t:#eff6ff;--m:#8da3bd;--g:#22c55e;--r:#ef4444;--y:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{padding:20px 14px;border-right:1px solid var(--l);background:#050e19;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:900;display:flex;gap:9px;align-items:center}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--g),#38bdf8);display:grid;place-items:center;color:#02120a}.tag{margin-left:auto;font-size:10px;background:#7bf1a8;color:#001b0e;padding:4px 7px;border-radius:99px}.nav{display:grid;gap:6px;margin-top:24px}.nav button,.btn{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:11px;padding:10px 12px;font-weight:800;cursor:pointer}.nav button{border:0;background:transparent;text-align:left;color:var(--m)}.nav button.active{background:var(--p2);color:#fff}.foot{position:absolute;bottom:18px;color:var(--m);font-size:11px}.main{padding:26px}.top{display:flex;justify-content:space-between;gap:14px;margin-bottom:18px}.title{font-size:30px;font-weight:900}.sub,.meta,.note{color:var(--m);font-size:11px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:16px}.stat,.sec{padding:16px}.val{font-size:24px;font-weight:900;margin-top:4px}.banner{padding:13px 15px;border:1px solid #285948;border-radius:14px;background:#10283d;margin-bottom:16px}.list{display:grid;gap:10px}.deal{display:grid;grid-template-columns:60px 1.2fr 1.9fr auto;gap:12px;align-items:center;padding:13px;border:1px solid #203a5a;border-radius:14px;background:#0b1a2c}.pic{width:56px;height:56px;border-radius:10px;background:#071827;display:grid;place-items:center;font-size:26px;object-fit:cover}.name{font-weight:900}.source{display:inline-block;margin-top:5px;padding:4px 7px;border-radius:99px;background:#15314b;border:1px solid #285675;font-size:10px;font-weight:800}.compare{display:grid;grid-template-columns:.9fr 1.1fr 1.1fr;gap:7px}.box{background:#071827;border:1px solid #1d3b5c;border-radius:10px;padding:8px}.box.best{border-color:#267348;background:#0d2d1e}.box span{display:block;color:var(--m);font-size:9px;text-transform:uppercase}.box b{display:block;margin-top:3px}.good{color:#65e58c}.bad{color:#ff7c86}.score{width:45px;height:45px;border:4px solid var(--g);border-radius:50%;display:grid;place-items:center;font-weight:900}.da{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.mini{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:800;text-decoration:none;cursor:pointer}.open{background:#173a64}.buy{background:#103b27}.disabled{opacity:.45;cursor:not-allowed}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #1a314c}.field{display:grid;gap:5px;margin-bottom:10px}.field input,.field select{background:#081827;color:#fff;border:1px solid var(--l);border-radius:10px;padding:10px}.sourcegrid{grid-template-columns:repeat(2,1fr)}.status{display:inline-block;padding:4px 7px;border-radius:99px;font-size:10px;font-weight:900}.on{background:#154a2d;color:#8ff0b0}.pending{background:#493b15;color:#ffd66f}.manual{background:#3b304f;color:#d5b7ff}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modalbox{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--p);border:1px solid #294866;border-radius:15px;padding:18px}.bottom{display:none}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.deal{grid-template-columns:56px 1fr auto}.compare{grid-column:1/-1}.sourcegrid{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}.side{display:none}.main{padding:16px 12px 78px}.top{display:block}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#050e19;border-top:1px solid var(--l);padding:7px}.bottom button{border:0;background:transparent;color:var(--m);font-size:10px}.bottom button.active{color:#fff}.compare{grid-template-columns:1fr}.deal .da{grid-column:1/-1}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">⌁</div>DealHunter AI <span id="tag" class="tag">STRICT</span></div><div id="nav" class="nav"></div><div class="foot">V1.5 · solo offerte con URL esatto</div></aside><main class="main"><div id="view"></div></main></div><div id="bottom" class="bottom"></div><div id="connect" class="modal"><div class="modalbox"><h3>Collega eBay LIVE</h3><p class="note">Inserisci solo un Application Access Token temporaneo. Il Client Secret non va mai messo nella pagina.</p><div class="field"><input id="tok" type="password" placeholder="Token eBay"></div><button class="btn" onclick="goLive()">Connetti</button> <button class="btn" onclick="connect.classList.remove('show')">Annulla</button></div></div><script>'use strict';const DEF={capital:500,cash:500,portfolio:[],manual:[],minScore:55};let s=(()=>{try{return Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem('dh15')||'{}'))}catch{return structuredClone(DEF)}})(),page='home',token='',liveItems=[];const euro=v=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0),save=()=>localStorage.setItem('dh15',JSON.stringify(s)),icon=c=>({Smartphone:'📱',Console:'🎮',GPU:'🖥️',Notebook:'💻',Fotocamere:'📷'}[c]||'📦');function calc(total,market){let ep=Math.round(market*.94),sp=Math.round(market*.93),ec=5,sc=5,e=ep-total-ec,q=sp-total-sc;return{ebayPrice:ep,subitoPrice:sp,eProfit:e,qProfit:q,eRoi:e/total*100,qRoi:q/total*100,best:e>=q?'eBay':'Subito'}}function enrich(x){let ch=calc(x.total,x.market),bp=Math.max(ch.eProfit,ch.qProfit),br=Math.max(ch.eRoi,ch.qRoi),disc=x.market?((x.market-x.total)/x.market*100):0,score=Math.round(Math.max(0,Math.min(100,50+disc*1.3+br*.8)));return{...x,...ch,bestProfit:bp,bestRoi:br,score}}function offers(){return[...liveItems,...s.manual.map(enrich)].filter(x=>x.url&&/^https?:\/\//i.test(x.url)).sort((a,b)=>b.score-a.score)}function nav(){let n=[['home','⌂ Home'],['offers','◎ Offerte reali'],['sources','⌁ Sorgenti'],['add','＋ Aggiungi URL'],['settings','⚙ Impostazioni']];navEl.innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');bottom.innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function go(p){page=p;render()}function head(t,sub){return`<div class="top"><div><div class="title">${t}</div><div class="sub">${sub}</div></div><div><button class="btn" onclick="connect.classList.add('show')">Collega eBay LIVE</button></div></div>`}function stats(){return`<div class="grid stats"><div class="card stat"><div class="meta">Liquidità</div><div class="val">${euro(s.cash)}</div></div><div class="card stat"><div class="meta">Offerte reali</div><div class="val">${offers().length}</div></div><div class="card stat"><div class="meta">In portafoglio</div><div class="val">${s.portfolio.length}</div></div><div class="card stat"><div class="meta">Modalità</div><div class="val">STRICT</div></div></div>`}function card(x){let pic=x.img?`<img class="pic" src="${x.img}">`:`<div class="pic">${icon(x.c)}</div>`,be=x.best==='eBay'?' best':'',bs=x.best==='Subito'?' best':'';return`<div class="deal">${pic}<div><div class="name">${x.n}</div><div class="meta">${x.c||'Altro'}</div><span class="source">${x.source}</span><div class="meta">URL ESATTO DISPONIBILE</div></div><div class="compare"><div class="box"><span>Compra a</span><b>${euro(x.total)}</b><div class="meta">${euro(x.ask)} + ${euro(x.ship)} sped.</div></div><div class="box${be}"><span>Rivendi eBay</span><b>${euro(x.ebayPrice)}</b><div class="good">Utile ${euro(x.eProfit)}</div><div class="meta">ROI ${x.eRoi.toFixed(1)}%</div></div><div class="box${bs}"><span>Rivendi Subito</span><b>${euro(x.subitoPrice)}</b><div class="good">Utile ${euro(x.qProfit)}</div><div class="meta">ROI ${x.qRoi.toFixed(1)}%</div></div></div><div><div class="score">${x.score}</div><div class="meta">Meglio: ${x.best}</div><div class="da"><a class="mini open" href="${x.url}" target="_blank" rel="noopener">Apri offerta specifica</a><button class="mini buy" onclick="buy('${x.id}')">Simula acquisto</button></div></div></div>`}function home(){let a=offers().filter(x=>x.bestProfit>0).slice(0,5);view.innerHTML=head('Dashboard','Mostro come offerta solo ciò che ha un URL preciso del prodotto.')+`<div class="banner"><b>STRICT MODE</b> — niente più Amazon DEMO o link a liste generiche tra le offerte reali. Se non esiste un URL preciso, il prodotto non appare qui.</div>`+stats()+`<div class="card sec"><h3>🔥 Migliori offerte reali</h3><div class="list">${a.length?a.map(card).join(''):'<div class="note">Nessuna offerta reale ancora collegata. Puoi collegare eBay LIVE oppure usare “Aggiungi URL” per testare un prodotto specifico.</div>'}</div></div>`}function realOffers(){view.innerHTML=head('Offerte reali','Ogni pulsante apre esattamente il prodotto analizzato.')+`<div class="card sec"><div class="list">${offers().length?offers().map(card).join(''):'<div class="note">Nessuna offerta reale.</div>'}</div></div>`}function sources(){view.innerHTML=head('Sorgenti','Stato integrazioni.')+`<div class="grid sourcegrid"><div class="card sec"><h3>eBay Italia</h3><span class="status on">LIVE COLLEGABILE</span><p class="note">Browse API: restituisce URL dello specifico annuncio.</p></div><div class="card sec"><h3>Amazon.it</h3><span class="status pending">LIVE DA COLLEGARE</span><p class="note">Non mostro più offerte Amazon simulate. Per prezzo + URL esatto serve un connettore lato backend che recuperi ASIN/offerta reale.</p></div><div class="card sec"><h3>Web / negozi</h3><span class="status pending">DA COLLEGARE</span><p class="note">Solo feed/API/risultati che forniscono una pagina prodotto precisa.</p></div><div class="card sec"><h3>Subito</h3><span class="status manual">RIVENDITA / CONTROLLO</span><p class="note">Usato come canale di rivendita e confronto manuale, non come sorgente automatica via scraping.</p></div></div>`}function add(){view.innerHTML=head('Aggiungi offerta esatta','Test immediato: incolla la pagina precisa del prodotto, non una ricerca.')+`<div class="card sec"><div class="field"><label>Fonte</label><select id="src"><option>Amazon</option><option>eBay</option><option>Negozio web</option></select></div><div class="field"><label>Nome prodotto</label><input id="nm" placeholder="es. PlayStation 5 Slim Disc"></div><div class="field"><label>URL esatto prodotto</label><input id="url" placeholder="https://.../pagina-prodotto"></div><div class="field"><label>Prezzo offerta (€)</label><input id="ask" type="number"></div><div class="field"><label>Spedizione (€)</label><input id="ship" type="number" value="0"></div><div class="field"><label>Valore mercato attivo stimato (€)</label><input id="market" type="number"></div><button class="btn" onclick="addExact()">Aggiungi offerta esatta</button></div>`}function settings(){view.innerHTML=head('Impostazioni','Parametri base.')+`<div class="card sec"><div class="field"><label>Capitale</label><input id="cap" type="number" value="${s.capital}"></div><div class="field"><label>Score minimo</label><input id="ms" type="number" value="${s.minScore}"></div><button class="btn" onclick="saveSet()">Salva</button></div>`}function render(){window.navEl=document.getElementById('nav');nav();({home,offers:realOffers,sources,add,settings}[page]||home)()}function addExact(){let u=url.value.trim(),a=+ask.value,sh=+ship.value,m=+market.value,n=nm.value.trim();if(!n||!/^https?:\/\//i.test(u)||!a||!m)return alert('Inserisci nome, URL preciso, prezzo e valore mercato');s.manual.push({id:'m'+Date.now(),n,c:'Altro',source:src.value,url:u,ask:a,ship:sh,total:a+sh,market:m,img:''});save();page='offers';render()}function buy(id){let x=offers().find(z=>z.id===id);if(!x||x.total>s.cash)return;s.cash-=x.total;s.portfolio.push(x);save();render()}function saveSet(){let old=s.capital;s.capital=+cap.value||500;s.cash+=s.capital-old;s.minScore=+ms.value||0;save();render()}async function goLive(){token=tok.value.trim();if(!token)return;connect.classList.remove('show');try{let qs=['iPhone 13 128GB','PlayStation 5 Slim Disc','Nintendo Switch OLED','RTX 4070','MacBook Air M1'],out=[];for(const q of qs){let r=await fetch('https://api.ebay.com/buy/browse/v1/item_summary/search?q='+encodeURIComponent(q)+'&limit=20&filter=buyingOptions:{FIXED_PRICE}',{headers:{Authorization:'Bearer '+token,'X-EBAY-C-MARKETPLACE-ID':'EBAY_IT'}});if(!r.ok)throw Error(r.status);let j=await r.json(),raw=(j.itemSummaries||[]).map(it=>{let ask=+(it.price?.value||0),ship=+(it.shippingOptions?.[0]?.shippingCost?.value||0);return{it,ask,ship,total:ask+ship}}).filter(z=>z.ask&&z.it.itemWebUrl);if(raw.length<2)continue;let vals=raw.map(z=>z.total).sort((a,b)=>a-b),m=Math.floor(vals.length/2),median=vals.length%2?vals[m]:(vals[m-1]+vals[m])/2;for(const z of raw)out.push(enrich({id:'e'+String(z.it.itemId).replace(/\W/g,''),n:z.it.title||q,c:'Altro',source:'eBay LIVE',url:z.it.itemWebUrl,ask:z.ask,ship:z.ship,total:z.total,market:Math.round(median),img:z.it.image?.imageUrl||''}))}liveItems=out.filter(x=>x.bestProfit>0);page='offers';render()}catch(e){alert('La chiamata diretta eBay è stata bloccata/rifiutata. Per il LIVE stabile serve il backend sicuro.')}}render();</script></body></html>
