<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealHunter AI V1.4.1</title><style>
:root{--b:#07111f;--p:#0d1b2d;--p2:#10243c;--l:#1e3653;--t:#eff6ff;--m:#8da3bd;--g:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:20px 14px;border-right:1px solid var(--l);background:#050e19}.brand{font-size:20px;font-weight:900;display:flex;gap:8px;align-items:center}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--g),#38bdf8);display:grid;place-items:center;color:#02120a}.tag{margin-left:auto;font-size:10px;background:#7bf1a8;color:#001b0e;padding:4px 7px;border-radius:99px}.nav{display:grid;gap:6px;margin-top:22px}.nav button,.btn{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}.nav button{border:0;background:transparent;text-align:left;color:var(--m)}.nav button.active{background:var(--p2);color:#fff}.main{padding:26px}.top{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}.title{font-size:30px;font-weight:900}.sub,.meta,.note{color:var(--m);font-size:11px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:16px}.stat,.sec{padding:16px}.val{font-size:24px;font-weight:900;margin-top:4px}.list{display:grid;gap:10px}.deal{display:grid;grid-template-columns:60px 1.25fr 1.9fr auto;gap:12px;align-items:center;padding:13px;border:1px solid #203a5a;border-radius:14px;background:#0b1a2c}.pic{width:56px;height:56px;border-radius:10px;background:#071827;display:grid;place-items:center;font-size:26px;object-fit:cover}.name{font-weight:900}.source{display:inline-block;margin-top:5px;padding:4px 7px;border-radius:99px;background:#15314b;border:1px solid #285675;font-size:10px;font-weight:800}.compare{display:grid;grid-template-columns:.9fr 1.1fr 1.1fr;gap:7px}.box{background:#071827;border:1px solid #1d3b5c;border-radius:10px;padding:8px}.box.best{border-color:#267348;background:#0d2d1e}.box span{display:block;color:var(--m);font-size:9px;text-transform:uppercase}.box b{display:block;margin-top:3px}.good{color:#65e58c}.score{width:45px;height:45px;border:4px solid var(--g);border-radius:50%;display:grid;place-items:center;font-weight:900}.da{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.mini{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:800;text-decoration:none;cursor:pointer}.amazon{background:#56340d}.open{background:#173a64}.buy{background:#103b27}.banner{padding:12px 14px;border:1px solid #285948;border-radius:13px;background:#10283d;margin-bottom:15px}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #1a314c}.field{display:grid;gap:5px;margin-bottom:10px}.field input{background:#081827;color:#fff;border:1px solid var(--l);border-radius:10px;padding:10px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modalbox{width:min(650px,100%);background:var(--p);border:1px solid #294866;border-radius:15px;padding:18px}.bottom{display:none}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.deal{grid-template-columns:56px 1fr auto}.compare{grid-column:1/-1}}@media(max-width:700px){.app{display:block}.side{display:none}.main{padding:16px 12px 78px}.top{display:block}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#050e19;border-top:1px solid var(--l);padding:7px}.bottom button{border:0;background:transparent;color:var(--m);font-size:10px}.bottom button.active{color:#fff}.compare{grid-template-columns:1fr}.deal .da{grid-column:1/-1}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">⌁</div>DealHunter AI <span id="tag" class="tag">DEMO</span></div><div id="nav" class="nav"></div></aside><main class="main"><div id="view"></div></main></div><div id="bottom" class="bottom"></div>
<div id="connect" class="modal"><div class="modalbox"><h3>Collega eBay LIVE</h3><p class="note">Incolla solo un Application Access Token temporaneo.</p><div class="field"><input id="tok" type="password" placeholder="Token eBay"></div><button class="btn" onclick="goLive()">Connetti</button> <button class="btn" onclick="connect.classList.remove('show')">Annulla</button></div></div>
<div id="detail" class="modal"><div class="modalbox"><div id="detailBody"></div><button class="btn" onclick="detail.classList.remove('show')">Chiudi</button></div></div><script>
'use strict';const DEMO=[['iPhone 13 128GB','Smartphone',335,248,8,94,'ebay','eBay DEMO'],['PlayStation 5 Slim Disc','Console',385,292,12,93,'amazon','Amazon DEMO'],['Nintendo Switch OLED','Console',250,185,9,90,'web','Negozio DEMO'],['RTX 4070 12GB','GPU',485,359,11,86,'ebay','eBay DEMO'],['MacBook Air M1 256GB','Notebook',545,419,14,89,'web','Negozio DEMO'],['Sony A6400 body','Fotocamere',575,435,10,78,'amazon','Amazon DEMO']];const DEF={capital:500,cash:500,portfolio:[],seed:1,minScore:55};let s=(()=>{try{return Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem('dh141')||'{}'))}catch{return structuredClone(DEF)}})(),page='home',live=false,token='',liveItems=[];const euro=v=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0),save=()=>localStorage.setItem('dh141',JSON.stringify(s)),icon=c=>({Smartphone:'📱',Console:'🎮',GPU:'🖥️',Notebook:'💻',Fotocamere:'📷'}[c]||'📦'),ebaySearch=n=>'https://www.ebay.it/sch/i.html?_nkw='+encodeURIComponent(n),amazonSearch=n=>'https://www.amazon.it/s?k='+encodeURIComponent(n),webSearch=n=>'https://www.google.com/search?q='+encodeURIComponent(n+' prezzo Italia compra online'),subitoSearch=n=>'https://www.subito.it/annunci-italia/vendita/usato/?q='+encodeURIComponent(n);function calc(total,market){let ep=Math.round(market*.94),sp=Math.round(market*.93),ec=5,sc=5,e=ep-total-ec,q=sp-total-sc;return{ebayPrice:ep,subitoPrice:sp,eProfit:e,qProfit:q,eRoi:e/total*100,qRoi:q/total*100,best:e>=q?'eBay':'Subito'}}function demo(){return DEMO.map((x,i)=>{let ask=x[3]+(((s.seed*(i+3)*17)%13)-6),ship=x[4],total=ask+ship,ch=calc(total,x[2]),bp=Math.max(ch.eProfit,ch.qProfit),br=Math.max(ch.eRoi,ch.qRoi),score=Math.max(0,Math.min(100,Math.round(52+br*.9+x[5]*.22)));return{id:'d'+i,n:x[0],c:x[1],market:x[2],ask,ship,total,sourceType:x[6],source:x[7],real:false,score,bestProfit:bp,...ch}}).sort((a,b)=>b.score-a.score)}const deals=()=>live&&liveItems.length?liveItems:demo(),ok=()=>deals().filter(x=>x.score>=s.minScore&&x.bestProfit>0);function sourceUrl(x){if(x.real&&x.url)return x.url;if(x.sourceType==='amazon')return amazonSearch(x.n);if(x.sourceType==='ebay')return ebaySearch(x.n);return webSearch(x.n)}function sourceLabel(x){if(x.real)return'Apri questa offerta';if(x.sourceType==='amazon')return'Cerca modello su Amazon';if(x.sourceType==='ebay')return'Cerca modello su eBay';return'Cerca modello sul web'}function nav(){let n=[['home','⌂ Home'],['deals','◎ Occasioni'],['sources','⌁ Sorgenti'],['portfolio','▣ Portafoglio'],['settings','⚙ Impostazioni']];document.getElementById('nav').innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');bottom.innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');tag.textContent=live?'LIVE':'DEMO'}function go(p){page=p;render()}function head(t,sub){return`<div class="top"><div><div class="title">${t}</div><div class="sub">${sub}</div></div><div>${live?'<button class="btn" onclick="offLive()">Torna DEMO</button>':'<button class="btn" onclick="connect.classList.add(\'show\')">Collega eBay LIVE</button>'} <button class="btn" onclick="scan()">Aggiorna</button></div></div>`}function stats(){return`<div class="grid stats"><div class="card stat"><div class="meta">Liquidità</div><div class="val">${euro(s.cash)}</div></div><div class="card stat"><div class="meta">Portafoglio</div><div class="val">${s.portfolio.length}</div></div><div class="card stat"><div class="meta">Affari validi</div><div class="val">${ok().length}</div></div><div class="card stat"><div class="meta">Modalità</div><div class="val">${live?'LIVE':'DEMO'}</div></div></div>`}function card(x){let pic=x.img?`<img class="pic" src="${x.img}">`:`<div class="pic">${icon(x.c)}</div>`,be=x.best==='eBay'?' best':'',bs=x.best==='Subito'?' best':'';return`<div class="deal">${pic}<div><div class="name">${x.n}</div><div class="meta">${x.c}</div><span class="source">${x.source}</span><div class="meta">${x.real?'OFFERTA REALE':'DEMO: prezzo simulato'}</div></div><div class="compare"><div class="box"><span>Compra a</span><b>${euro(x.total)}</b><div class="meta">incl. spedizione</div></div><div class="box${be}"><span>Rivendi eBay</span><b>${euro(x.ebayPrice)}</b><div class="good">Utile ${euro(x.eProfit)}</div><div class="meta">ROI ${x.eRoi.toFixed(1)}%</div></div><div class="box${bs}"><span>Rivendi Subito</span><b>${euro(x.subitoPrice)}</b><div class="good">Utile ${euro(x.qProfit)}</div><div class="meta">ROI ${x.qRoi.toFixed(1)}%</div></div></div><div><div class="score">${x.score}</div><div class="meta">Meglio: ${x.best}</div><div class="da"><a class="mini ${x.sourceType==='amazon'?'amazon':'open'}" href="${sourceUrl(x)}" target="_blank">${sourceLabel(x)}</a><button class="mini" onclick="showDetail('${x.id}')">Dettagli</button><button class="mini buy" onclick="buy('${x.id}')">Simula acquisto</button></div></div></div>`}function home(){view.innerHTML=head('Dashboard','La sorgente mostrata ora corrisponde al link aperto.')+`<div class="banner"><b>${live?'LIVE':'DEMO'}</b> — In DEMO non esiste un annuncio reale specifico: Amazon apre Amazon, eBay apre eBay. In LIVE il pulsante apre esattamente l'offerta analizzata.</div>`+stats()+`<div class="card sec"><div class="list">${ok().slice(0,5).map(card).join('')}</div></div>`}function opportunities(){view.innerHTML=head('Occasioni','Acquisto + rivendita stimata eBay/Subito.')+`<div class="card sec"><div class="list">${deals().map(card).join('')}</div></div>`}function sources(){view.innerHTML=head('Sorgenti','Stato collegamenti.')+`<div class="grid"><div class="card sec"><b>eBay</b><p class="note">LIVE collegabile: annuncio specifico.</p></div><div class="card sec"><b>Amazon</b><p class="note">DEMO: apre la ricerca Amazon del modello. Per prodotto specifico + prezzo reale serve il connettore Amazon LIVE.</p></div><div class="card sec"><b>Web Italia</b><p class="note">Il motore multi-sito reale richiede backend/feed/API autorizzati.</p></div><div class="card sec"><b>Subito</b><p class="note">Usato come canale di rivendita/confronto manuale.</p></div></div>`}function portfolio(){view.innerHTML=head('Portafoglio','Acquisti virtuali.')+`<div class="grid">${s.portfolio.length?s.portfolio.map(x=>`<div class="card sec"><b>${x.n}</b><div class="row"><span>Costo</span><b>${euro(x.total)}</b></div><div class="row"><span>Utile eBay</span><b>${euro(x.eProfit)}</b></div><div class="row"><span>Utile Subito</span><b>${euro(x.qProfit)}</b></div></div>`).join(''):'<div class="card sec">Vuoto.</div>'}</div>`}function settings(){view.innerHTML=head('Impostazioni','Parametri base.')+`<div class="card sec"><div class="field"><label>Capitale</label><input id="cap" type="number" value="${s.capital}"></div><div class="field"><label>Score minimo</label><input id="ms" type="number" value="${s.minScore}"></div><button class="btn" onclick="saveSet()">Salva</button></div>`}function render(){nav();({home,deals:opportunities,sources,portfolio,settings}[page]||home)()}function scan(){if(live)return ebayLive();s.seed++;save();render()}function buy(id){let x=deals().find(z=>z.id===id);if(!x||x.total>s.cash)return;s.cash-=x.total;s.portfolio.push(x);save();render()}function saveSet(){let old=s.capital;s.capital=+cap.value||500;s.cash+=s.capital-old;s.minScore=+ms.value||0;save();render()}function showDetail(id){let x=deals().find(z=>z.id===id)||s.portfolio.find(z=>z.id===id);if(!x)return;detailBody.innerHTML=`<h3>${x.n}</h3><div class="row"><span>Fonte</span><b>${x.source}</b></div><div class="row"><span>Costo totale</span><b>${euro(x.total)}</b></div><div class="row"><span>Rivendita eBay</span><b>${euro(x.ebayPrice)} / utile ${euro(x.eProfit)}</b></div><div class="row"><span>Rivendita Subito</span><b>${euro(x.subitoPrice)} / utile ${euro(x.qProfit)}</b></div><p class="note">${x.real?'Link specifico reale disponibile.':'DEMO: nessun annuncio specifico corrisponde esattamente al prezzo mostrato.'}</p><a class="btn" href="${sourceUrl(x)}" target="_blank">${sourceLabel(x)}</a>`;detail.classList.add('show')}function offLive(){live=false;liveItems=[];token='';render()}async function goLive(){token=tok.value.trim();if(!token)return;connect.classList.remove('show');await ebayLive()}async function ebayLive(){try{let qs=['iPhone 13 128GB','PlayStation 5 Slim Disc','Nintendo Switch OLED','RTX 4070','MacBook Air M1'],out=[];for(const q of qs){let r=await fetch('https://api.ebay.com/buy/browse/v1/item_summary/search?q='+encodeURIComponent(q)+'&limit=20&filter=buyingOptions:{FIXED_PRICE}',{headers:{Authorization:'Bearer '+token,'X-EBAY-C-MARKETPLACE-ID':'EBAY_IT'}});if(!r.ok)throw Error(r.status);let j=await r.json(),raw=(j.itemSummaries||[]).map(it=>{let ask=+(it.price?.value||0),ship=+(it.shippingOptions?.[0]?.shippingCost?.value||0);return{it,ask,ship,total:ask+ship}}).filter(z=>z.ask);if(raw.length<2)continue;let vals=raw.map(z=>z.total).sort((a,b)=>a-b),m=Math.floor(vals.length/2),median=vals.length%2?vals[m]:(vals[m-1]+vals[m])/2;for(const z of raw){let ch=calc(z.total,median),bp=Math.max(ch.eProfit,ch.qProfit),br=Math.max(ch.eRoi,ch.qRoi),score=Math.round(Math.max(0,Math.min(100,50+((median-z.total)/median*100)*1.4+br*.8)));out.push({id:'e'+String(z.it.itemId).replace(/\W/g,''),n:z.it.title||q,c:guess(z.it.title||q),ask:z.ask,ship:z.ship,total:z.total,market:Math.round(median),sourceType:'ebay',source:'eBay LIVE',real:true,url:z.it.itemWebUrl||ebaySearch(q),img:z.it.image?.imageUrl||'',score,bestProfit:bp,...ch})}}liveItems=out.filter(x=>x.bestProfit>0).sort((a,b)=>b.score-a.score);live=!!liveItems.length;render()}catch(e){alert('eBay LIVE non disponibile dal browser: per renderlo stabile serve il backend sicuro.');live=false;render()}}function guess(n){n=n.toLowerCase();if(/iphone|samsung|pixel/.test(n))return'Smartphone';if(/playstation|switch|xbox|steam/.test(n))return'Console';if(/rtx|radeon|geforce/.test(n))return'GPU';if(/macbook|laptop|notebook|thinkpad/.test(n))return'Notebook';return'Fotocamere'}render();</script></body></html>
