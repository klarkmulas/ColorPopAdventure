<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DealHunter AI V1.4</title>
<style>
:root{--b:#07111f;--p:#0d1b2d;--p2:#10243c;--l:#1e3653;--t:#eff6ff;--m:#8da3bd;--g:#22c55e;--r:#ef4444;--y:#f59e0b;--blue:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101d,#07111f);color:var(--t);font:14px system-ui,Segoe UI,Arial}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:20px 14px;border-right:1px solid var(--l);background:#050e19;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:900;display:flex;gap:9px;align-items:center}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--g),var(--blue));display:grid;place-items:center;color:#02120a}.tag{margin-left:auto;font-size:10px;padding:4px 7px;border-radius:99px;background:#7bf1a8;color:#001b0e}.nav{display:grid;gap:6px;margin-top:24px}.nav button,.btn{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:11px;padding:10px 12px;font-weight:800;cursor:pointer}.nav button{border:0;background:transparent;text-align:left;color:var(--m)}.nav button.active{background:var(--p2);color:#fff}.sidefoot{position:absolute;bottom:18px;left:14px;right:14px;color:var(--m);font-size:11px;line-height:1.5}.main{padding:26px}.top{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px}.title{font-size:30px;font-weight:900}.sub{color:var(--m)}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{border:0;background:linear-gradient(135deg,#16a34a,#0ea5e9)}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(5,1fr);margin-bottom:16px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:16px}.stat,.sec{padding:16px}.lab{color:var(--m);font-size:12px}.val{font-size:24px;font-weight:900;margin-top:5px}.good{color:#65e58c}.bad{color:#ff7c86}.warn{color:#ffc55d}.banner{padding:13px 15px;border:1px solid #285948;border-radius:14px;background:#10283d;margin-bottom:16px}.list{display:grid;gap:10px}.deal{display:grid;grid-template-columns:64px minmax(180px,1.15fr) minmax(340px,1.8fr) auto;gap:12px;align-items:center;padding:13px;border:1px solid #203a5a;border-radius:14px;background:#0b1a2c}.pic{width:60px;height:60px;border-radius:11px;background:#07111f;display:grid;place-items:center;font-size:27px;object-fit:cover}.name{font-weight:900}.meta{color:var(--m);font-size:11px;margin-top:3px}.source{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:99px;background:#15314b;border:1px solid #285675;font-size:10px;font-weight:800}.compare{display:grid;grid-template-columns:.9fr 1.1fr 1.1fr;gap:7px}.box{background:#071827;border:1px solid #1d3b5c;border-radius:11px;padding:9px}.box span{display:block;color:var(--m);font-size:9px;text-transform:uppercase;letter-spacing:.04em}.box b{display:block;margin-top:3px;font-size:14px}.box.best{border-color:#267348;background:#0d2d1e}.roi{font-size:10px;color:#65e58c;margin-top:2px}.score{width:46px;height:46px;border:4px solid var(--g);border-radius:50%;display:grid;place-items:center;font-weight:900}.da{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.mini{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:800;text-decoration:none;cursor:pointer}.buy{background:#103b27}.open{background:#173a64}.two{grid-template-columns:1.25fr .75fr}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #1a314c}.empty{padding:30px;text-align:center;color:var(--m)}.field{display:grid;gap:5px;margin-bottom:10px}.field input,.field select{background:#081827;color:#fff;border:1px solid var(--l);border-radius:10px;padding:10px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.modalbox{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--p);border:1px solid #294866;border-radius:16px;padding:18px}.toast{position:fixed;right:18px;bottom:18px;background:var(--p2);border:1px solid #2f5479;padding:11px 13px;border-radius:11px;display:none;z-index:30}.toast.show{display:block}.bottom{display:none}.sourcegrid{grid-template-columns:repeat(2,1fr)}.sourcecard{padding:16px}.status{display:inline-block;padding:4px 7px;border-radius:99px;font-size:10px;font-weight:900}.on{background:#154a2d;color:#8ff0b0}.pending{background:#493b15;color:#ffd66f}.manual{background:#3b304f;color:#d5b7ff}.note{font-size:11px;color:var(--m);line-height:1.5}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.deal{grid-template-columns:60px 1fr auto}.compare{grid-column:1/-1}.sourcegrid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.side{display:none}.main{padding:16px 12px 82px}.top{display:block}.actions{margin-top:12px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#050e19;border-top:1px solid var(--l);padding:7px}.bottom button{border:0;background:transparent;color:var(--m);font-size:10px}.bottom button.active{color:#fff}.compare{grid-template-columns:1fr}.deal .da{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">⌁</div>DealHunter AI <span id="tag" class="tag">DEMO</span></div><div id="nav" class="nav"></div><div class="sidefoot">V1.4 · Web Scanner<br>Compra ovunque, rivendi dove conviene.</div></aside><main class="main"><div id="view"></div></main></div><div id="bottom" class="bottom"></div>
<div id="connect" class="modal"><div class="modalbox"><h3>Collega eBay LIVE</h3><p class="note">Incolla solo un Application Access Token temporaneo. Non inserire Client Secret. Il token resta solo nella memoria della pagina.</p><div class="field"><label>Application Access Token</label><input id="tok" type="password"></div><div class="actions"><button class="btn primary" onclick="goLive()">Connetti</button><button class="btn" onclick="closeLive()">Annulla</button></div></div></div>
<div id="detail" class="modal"><div class="modalbox"><div id="detailBody"></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="closeDetail()">Chiudi</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
const DEMO=[
['iPhone 13 128GB','Smartphone',335,248,8,94,'eBay DEMO'],['PlayStation 5 Slim Disc','Console',385,292,12,93,'Amazon DEMO'],['Nintendo Switch OLED','Console',250,185,9,90,'Feed negozio DEMO'],['RTX 4070 12GB','GPU',485,359,11,86,'eBay DEMO'],['MacBook Air M1 256GB','Notebook',545,419,14,89,'Feed negozio DEMO'],['Sony A6400 body','Fotocamere',575,435,10,78,'Amazon DEMO'],['iPhone 12 128GB','Smartphone',285,214,7,92,'eBay DEMO'],['Steam Deck OLED 512GB','Console',515,399,13,84,'Feed negozio DEMO']
];
const DEF={capital:500,cash:500,profit:0,portfolio:[],history:[],seed:1,minScore:55,ebayFee:0,subitoFee:0,packing:5,subitoDiscount:7};
let s=load(),page='home',live=false,token='',liveItems=[];
function load(){try{return Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem('dh14')||'{}'))}catch(e){return structuredClone(DEF)}}
function save(){localStorage.setItem('dh14',JSON.stringify(s))}
function euro(v){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0)}
function icon(c){return({Smartphone:'📱',Console:'🎮',GPU:'🖥️',Notebook:'💻',Fotocamere:'📷'})[c]||'📦'}
function ebaySearch(n){return'https://www.ebay.it/sch/i.html?_nkw='+encodeURIComponent(n)}
function subitoSearch(n){return'https://www.subito.it/annunci-italia/vendita/usato/?q='+encodeURIComponent(n)}
function calcChannels(total,market){let ebayPrice=Math.round(market*.94),subitoPrice=Math.round(market*(1-(s.subitoDiscount||0)/100));let eCost=Math.round(ebayPrice*(s.ebayFee||0)/100)+(s.packing||0),qCost=Math.round(subitoPrice*(s.subitoFee||0)/100)+(s.packing||0);let eProfit=ebayPrice-total-eCost,qProfit=subitoPrice-total-qCost;return{ebayPrice,subitoPrice,eCost,qCost,eProfit,qProfit,eRoi:eProfit/total*100,qRoi:qProfit/total*100,best:eProfit>=qProfit?'eBay':'Subito'}}
function demo(){return DEMO.map((x,i)=>{let ask=x[3]+(((s.seed*(i+3)*17)%13)-6),ship=x[4],total=ask+ship,market=x[2],ch=calcChannels(total,market),bestProfit=Math.max(ch.eProfit,ch.qProfit),bestRoi=Math.max(ch.eRoi,ch.qRoi),score=Math.max(0,Math.min(100,Math.round(52+bestRoi*.9+x[5]*.22)));return{id:'d'+i,n:x[0],c:x[1],ask,ship,total,market,score,source:x[6],real:false,url:'',img:'',seller:'',...ch,bestProfit,bestRoi}}).sort((a,b)=>b.score-a.score)}
function deals(){return live&&liveItems.length?liveItems:demo()}
function ok(){return deals().filter(x=>x.score>=s.minScore&&x.bestProfit>0)}
function nav(){let n=[['home','⌂ Home'],['deals','◎ Occasioni'],['sources','⌁ Sorgenti'],['portfolio','▣ Portafoglio'],['settings','⚙ Impostazioni']];document.getElementById('nav').innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');document.getElementById('bottom').innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');document.getElementById('tag').textContent=live?'LIVE':'DEMO';document.getElementById('tag').style.background=live?'#ff7b72':'#7bf1a8'}
function go(p){page=p;render()}
function head(t,sub){return`<div class="top"><div><div class="title">${t}</div><div class="sub">${sub}</div></div><div class="actions">${live?'<button class="btn" onclick="offLive()">Torna DEMO</button>':'<button class="btn" onclick="openLive()">Collega eBay LIVE</button>'}<button class="btn primary" onclick="scan()">Aggiorna</button></div></div>`}
function stats(){return`<div class="grid stats"><div class="card stat"><div class="lab">Liquidità</div><div class="val">${euro(s.cash)}</div></div><div class="card stat"><div class="lab">Profitto realizzato</div><div class="val ${s.profit>=0?'good':'bad'}">${euro(s.profit)}</div></div><div class="card stat"><div class="lab">Portafoglio</div><div class="val">${s.portfolio.length}</div></div><div class="card stat"><div class="lab">Affari validi</div><div class="val">${ok().length}</div></div><div class="card stat"><div class="lab">Fonti operative</div><div class="val">${live?'1':'0'}</div><div class="lab">+ demo multi-source</div></div></div>`}
function dealCard(x){let pic=x.img?`<img class="pic" src="${x.img}" alt="">`:`<div class="pic">${icon(x.c)}</div>`;let bestE=x.best==='eBay'?' best':'',bestS=x.best==='Subito'?' best':'';let openBuy=x.real?`<a class="mini open" href="${x.url}" target="_blank" rel="noopener">Apri offerta</a>`:`<button class="mini open" onclick="demoSource('${x.id}')">Vedi ricerca</button>`;return`<div class="deal">${pic}<div><div class="name">${x.n}</div><div class="meta">${x.c}</div><span class="source">${x.source}</span><div class="meta">Mercato attivo stimato: ${euro(x.market)}</div></div><div class="compare"><div class="box"><span>Compra a</span><b>${euro(x.total)}</b><div class="meta">${euro(x.ask)} + ${euro(x.ship)} sped.</div></div><div class="box${bestE}"><span>Rivendi eBay</span><b>${euro(x.ebayPrice)}</b><div class="good">Utile ${euro(x.eProfit)}</div><div class="roi">ROI ${x.eRoi.toFixed(1)}%</div></div><div class="box${bestS}"><span>Rivendi Subito</span><b>${euro(x.subitoPrice)}</b><div class="good">Utile ${euro(x.qProfit)}</div><div class="roi">ROI ${x.qRoi.toFixed(1)}%</div></div></div><div><div class="score">${x.score}</div><div class="meta" style="text-align:center">Meglio: <b>${x.best}</b></div><div class="da">${openBuy}<button class="mini" onclick="showDetail('${x.id}')">Dettagli</button><button class="mini buy" onclick="buy('${x.id}')">Simula acquisto</button></div></div></div>`}
function home(){let a=ok().slice(0,5);document.getElementById('view').innerHTML=head('Dashboard','Compra dove costa meno, rivendi dove il margine è migliore.')+`<div class="banner"><b>${live?'eBay LIVE attivo':'Web Scanner in preparazione'}</b> — La V1.4 confronta già eBay/Subito come canali di rivendita. Le altre fonti reali richiedono feed/API autorizzati.</div>`+stats()+`<div class="grid two"><section class="card sec"><h3>🔥 Top occasioni</h3><div class="list">${a.length?a.map(dealCard).join(''):'<div class="empty">Nessuna occasione supera i filtri.</div>'}</div></section><section class="card sec"><h3>Strategia</h3><div class="row"><span>Acquisto</span><b>Fonte più economica</b></div><div class="row"><span>Rivendita</span><b>eBay / Subito</b></div><div class="row"><span>Classifica</span><b>Utile netto + ROI</b></div><p class="note">Il prezzo di rivendita è una stima prudente, non una garanzia. In LIVE eBay il valore di mercato deriva dalla mediana delle inserzioni attive comparabili.</p></section></div>`}
function opportunities(){document.getElementById('view').innerHTML=head('Occasioni','Classifica multi-source; in LIVE l’offerta eBay apre lo specifico annuncio.')+`<div class="card sec"><div class="list">${deals().map(dealCard).join('')}</div></div>`}
function sources(){document.getElementById('view').innerHTML=head('Sorgenti web','Fonti di acquisto autorizzate e canali di rivendita.')+`<div class="grid sourcegrid"><div class="card sourcecard"><h3>eBay Italia</h3><span class="status on">LIVE COLLEGABILE</span><p class="note">Browse API ufficiale: prezzo, foto, venditore e link dello specifico annuncio.</p><button class="btn primary" onclick="openLive()">Collega eBay LIVE</button></div><div class="card sourcecard"><h3>Amazon.it</h3><span class="status pending">DA COLLEGARE</span><p class="note">Useremo Amazon Creators API lato backend per cercare prodotti, prezzi e offerte senza esporre credenziali nel browser.</p></div><div class="card sourcecard"><h3>Negozi italiani / europei che vendono in Italia</h3><span class="status pending">DA COLLEGARE</span><p class="note">Awin Product Feed/API e altri feed ufficiali: possono fornire nome prodotto, prezzo, immagine e deep link direttamente dal retailer.</p></div><div class="card sourcecard"><h3>Subito</h3><span class="status manual">RIVENDITA / CONTROLLO MANUALE</span><p class="note">Lo useremo per stimare e pubblicare manualmente la rivendita. Niente scraping automatico.</p></div></div>`}
function portfolio(){document.getElementById('view').innerHTML=head('Portafoglio','Oggetti acquistati virtualmente.')+stats()+`<div class="grid">${s.portfolio.length?s.portfolio.map(x=>`<div class="card sec"><b>${x.n}</b><div class="row"><span>Costo acquisto</span><b>${euro(x.total)}</b></div><div class="row"><span>Target eBay</span><b>${euro(x.ebayPrice)} · utile ${euro(x.eProfit)}</b></div><div class="row"><span>Target Subito</span><b>${euro(x.subitoPrice)} · utile ${euro(x.qProfit)}</b></div><div class="row"><span>Canale consigliato</span><b class="good">${x.best}</b></div></div>`).join(''):'<div class="card empty">Portafoglio vuoto.</div>'}</div>`}
function settings(){document.getElementById('view').innerHTML=head('Impostazioni','Adatta il calcolo dei margini al tuo caso.')+`<div class="card sec"><div class="field"><label>Capitale iniziale (€)</label><input id="cap" type="number" value="${s.capital}"></div><div class="field"><label>Deal Score minimo</label><input id="ms" type="number" value="${s.minScore}"></div><div class="field"><label>Costi eBay stimati (%)</label><input id="ef" type="number" step="0.1" value="${s.ebayFee}"></div><div class="field"><label>Costi Subito stimati (%)</label><input id="sf" type="number" step="0.1" value="${s.subitoFee}"></div><div class="field"><label>Imballaggio/altri costi per vendita (€)</label><input id="pack" type="number" step="1" value="${s.packing}"></div><div class="field"><label>Sconto target Subito rispetto al mercato (%)</label><input id="sd" type="number" step="1" value="${s.subitoDiscount}"></div><button class="btn primary" onclick="saveSet()">Salva</button><p class="note">I costi sono configurabili perché dipendono dal tipo di account, categoria e modalità di vendita. DealHunter non presume automaticamente che ogni operazione abbia costo zero.</p></div>`}
function render(){nav();({home,deals:opportunities,sources,portfolio,settings}[page]||home)()}
function scan(){if(live)return ebayLive();s.seed++;save();render();toastMsg('Scansione demo aggiornata')}
function demoSource(id){let x=deals().find(z=>z.id===id);if(!x)return;window.open(ebaySearch(x.n),'_blank','noopener')}
function buy(id){let x=deals().find(z=>z.id===id);if(!x)return;if(s.portfolio.some(z=>z.id===id))return toastMsg('Già nel portafoglio');if(x.total>s.cash)return toastMsg('Liquidità insufficiente');s.cash-=x.total;s.portfolio.push(x);s.history.push({type:'Acquisto',n:x.n,amount:x.total});save();render();toastMsg('Acquisto virtuale registrato')}
function showDetail(id){let x=deals().find(z=>z.id===id)||s.portfolio.find(z=>z.id===id);if(!x)return;detailBody.innerHTML=`<h3>${x.n}</h3><div class="sub">Fonte: ${x.source}${x.seller?' · '+x.seller:''}</div><div class="row"><span>Prezzo acquisto</span><b>${euro(x.ask)}</b></div><div class="row"><span>Spedizione acquisto</span><b>${euro(x.ship)}</b></div><div class="row"><span>Costo totale</span><b>${euro(x.total)}</b></div><div class="row"><span>Mercato attivo stimato</span><b>${euro(x.market)}</b></div><div class="row"><span>eBay: target / utile</span><b>${euro(x.ebayPrice)} / <span class="good">${euro(x.eProfit)}</span></b></div><div class="row"><span>Subito: target / utile</span><b>${euro(x.subitoPrice)} / <span class="good">${euro(x.qProfit)}</span></b></div><div class="row"><span>Canale consigliato</span><b class="good">${x.best}</b></div><div class="actions" style="margin-top:14px">${x.real?`<a class="btn primary" href="${x.url}" target="_blank" rel="noopener">Apri offerta specifica</a>`:''}<a class="btn" href="${ebaySearch(x.n)}" target="_blank" rel="noopener">Confronta eBay</a><a class="btn" href="${subitoSearch(x.n)}" target="_blank" rel="noopener">Confronta Subito</a></div><p class="note">Le stime di rivendita usano il mercato attivo e i parametri impostati. Non equivalgono a prezzi realmente venduti.</p>`;document.getElementById('detail').classList.add('show')}
function closeDetail(){document.getElementById('detail').classList.remove('show')}
function saveSet(){let old=s.capital;s.capital=+cap.value||500;s.cash+=s.capital-old;s.minScore=+ms.value||0;s.ebayFee=+ef.value||0;s.subitoFee=+sf.value||0;s.packing=+pack.value||0;s.subitoDiscount=+sd.value||0;save();render();toastMsg('Impostazioni salvate')}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>toast.classList.remove('show'),2200)}
function openLive(){connect.classList.add('show')}function closeLive(){connect.classList.remove('show')}function offLive(){live=false;liveItems=[];token='';render()}
async function goLive(){token=tok.value.trim();if(!token)return toastMsg('Inserisci il token');closeLive();await ebayLive()}
async function ebayLive(){if(!token)return openLive();toastMsg('Ricerca eBay LIVE…');try{let qs=['iPhone 13 128GB','PlayStation 5 Slim Disc','Nintendo Switch OLED','RTX 4070','MacBook Air M1'],out=[];for(const q of qs){let r=await fetch('https://api.ebay.com/buy/browse/v1/item_summary/search?q='+encodeURIComponent(q)+'&limit=20&filter=buyingOptions:{FIXED_PRICE}',{headers:{Authorization:'Bearer '+token,'X-EBAY-C-MARKETPLACE-ID':'EBAY_IT'}});if(!r.ok)throw Error('eBay '+r.status);let j=await r.json(),raw=[];for(const it of(j.itemSummaries||[])){let ask=+(it.price?.value||0);if(!ask)continue;let ship=+(it.shippingOptions?.[0]?.shippingCost?.value||0);raw.push({it,ask,ship,total:ask+ship})}if(raw.length<2)continue;let vals=raw.map(z=>z.total).sort((a,b)=>a-b),m=Math.floor(vals.length/2),median=vals.length%2?vals[m]:(vals[m-1]+vals[m])/2;for(const z of raw){let ch=calcChannels(z.total,median),bestProfit=Math.max(ch.eProfit,ch.qProfit),bestRoi=Math.max(ch.eRoi,ch.qRoi),discount=(median-z.total)/median*100,score=Math.round(Math.max(0,Math.min(100,50+discount*1.4+bestRoi*.8)));out.push({id:'e'+String(z.it.itemId||Math.random()).replace(/\W/g,''),n:z.it.title||q,c:guess(z.it.title||q),ask:z.ask,ship:z.ship,total:z.total,market:Math.round(median),score,source:'eBay',real:true,url:z.it.itemWebUrl||ebaySearch(q),img:z.it.image?.imageUrl||'',seller:z.it.seller?.username||'eBay',...ch,bestProfit,bestRoi})}}if(!out.length)throw Error('Nessun risultato');liveItems=out.filter(x=>x.bestProfit>0).sort((a,b)=>b.score-a.score);live=true;render();toastMsg('eBay LIVE attivo')}catch(e){console.error(e);live=false;liveItems=[];render();alert('La chiamata diretta a eBay è stata bloccata/rifiutata. Per il Web Scanner stabile useremo un backend sicuro con le credenziali lato server.')}}
function guess(n){n=n.toLowerCase();if(/iphone|samsung|pixel/.test(n))return'Smartphone';if(/playstation|switch|xbox|steam/.test(n))return'Console';if(/rtx|radeon|geforce/.test(n))return'GPU';if(/macbook|laptop|notebook|thinkpad/.test(n))return'Notebook';return'Fotocamere'}
window.onerror=(m)=>{console.error(m);return false};render();
</script>
</body></html>
