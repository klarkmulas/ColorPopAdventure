<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealHunter AI V1.7</title><style>
:root{--b:#07111f;--p:#0d1b2d;--p2:#10243c;--l:#1e3653;--t:#eff6ff;--m:#8da3bd;--g:#22c55e;--r:#ef4444;--y:#f59e0b;--blue:#38bdf8}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:20px 14px;background:#050e19;border-right:1px solid var(--l);position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:900;display:flex;gap:9px;align-items:center}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--g),var(--blue));display:grid;place-items:center;color:#02120a}.tag{margin-left:auto;font-size:10px;background:#7bf1a8;color:#001b0e;padding:4px 7px;border-radius:99px}.nav{display:grid;gap:6px;margin-top:24px}.nav button,.btn{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:11px;padding:10px 12px;font-weight:800;cursor:pointer}.nav button{border:0;background:transparent;text-align:left;color:var(--m)}.nav button.active{background:var(--p2);color:#fff}.foot{position:absolute;bottom:18px;color:var(--m);font-size:11px}.main{padding:26px}.top{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}.title{font-size:30px;font-weight:900}.sub,.meta,.note{color:var(--m);font-size:11px;line-height:1.45}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{border:0;background:linear-gradient(135deg,#16a34a,#0ea5e9)}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(5,1fr);margin-bottom:16px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:16px}.stat,.sec{padding:16px}.val{font-size:24px;font-weight:900;margin-top:4px}.banner{padding:13px 15px;border:1px solid #285948;border-radius:14px;background:#10283d;margin-bottom:16px}.searchbar{display:flex;gap:8px;margin:0 0 16px}.searchbar input{flex:1;background:#081827;color:#fff;border:1px solid var(--l);border-radius:11px;padding:12px}.list{display:grid;gap:10px}.deal{display:grid;grid-template-columns:64px 1.25fr 1.9fr auto;gap:12px;align-items:center;padding:13px;border:1px solid #203a5a;border-radius:14px;background:#0b1a2c}.pic{width:60px;height:60px;border-radius:11px;background:#071827;display:grid;place-items:center;font-size:26px;object-fit:cover}.name{font-weight:900}.source{display:inline-block;margin-top:5px;padding:4px 7px;border-radius:99px;background:#15314b;border:1px solid #285675;font-size:10px;font-weight:800}.compare{display:grid;grid-template-columns:.9fr 1.1fr 1.1fr;gap:7px}.box{background:#071827;border:1px solid #1d3b5c;border-radius:10px;padding:8px}.box.best{border-color:#267348;background:#0d2d1e}.box span{display:block;color:var(--m);font-size:9px;text-transform:uppercase}.box b{display:block;margin-top:3px}.good{color:#65e58c}.bad{color:#ff7c86}.warn{color:#ffc55d}.score{width:45px;height:45px;border:4px solid var(--g);border-radius:50%;display:grid;place-items:center;font-weight:900}.score.unknown{border-color:#64748b;color:#94a3b8}.da{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.mini{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:800;text-decoration:none;cursor:pointer}.open{background:#173a64}.field{display:grid;gap:5px;margin-bottom:10px}.field input{background:#081827;color:#fff;border:1px solid var(--l);border-radius:10px;padding:10px;width:100%}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #1a314c}.diag{grid-template-columns:repeat(4,1fr)}.pill{display:inline-block;padding:4px 7px;border-radius:99px;font-size:10px;font-weight:900}.ok{background:#154a2d;color:#8ff0b0}.maybe{background:#493b15;color:#ffd66f}.bottom{display:none}.saved{margin-top:10px;color:#65e58c;font-weight:800;display:none}@media(max-width:1050px){.stats,.diag{grid-template-columns:repeat(2,1fr)}.deal{grid-template-columns:60px 1fr auto}.compare{grid-column:1/-1}}@media(max-width:700px){.app{display:block}.side{display:none}.main{padding:16px 12px 78px}.top{display:block}.actions{margin-top:12px}.bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:#050e19;border-top:1px solid var(--l);padding:7px}.bottom button{border:0;background:transparent;color:var(--m);font-size:10px}.bottom button.active{color:#fff}.compare{grid-template-columns:1fr}.deal .da{grid-column:1/-1}.searchbar{display:grid}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">⌁</div>DealHunter AI <span class="tag">V1.7</span></div><div id="nav" class="nav"></div><div class="foot">Web Scanner reale<br>Scopri + cerca prodotto.</div></aside><main class="main"><div id="view"></div></main></div><div id="bottom" class="bottom"></div><script>
'use strict';
const DEF={endpoint:'https://dealhunter-scanner.mulas-claudio88.workers.dev',items:[],lastScan:'',mode:'',query:'',offset:0,capital:500,minProfit:25,minRoi:10,ebayFee:0,subitoFee:0,packing:5,subitoDiscount:7,stats:null};
let s=(()=>{try{return Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem('dh17')||'{}'))}catch{return structuredClone(DEF)}})(),page='home',busy=false;
const save=()=>localStorage.setItem('dh17',JSON.stringify(s)),key=()=>sessionStorage.getItem('dh17key')||sessionStorage.getItem('dh16key')||'',euro=v=>v==null||!Number.isFinite(+v)?'—':new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(+v),icon=t=>/iphone|samsung|pixel|smartphone/i.test(t)?'📱':/playstation|switch|xbox|steam|console/i.test(t)?'🎮':/rtx|radeon|geforce|gpu/i.test(t)?'🖥️':/macbook|notebook|laptop/i.test(t)?'💻':/camera|fotocamera|sony|canon|nikon/i.test(t)?'📷':'📦';
function calc(x){let market=+x.market||0,total=+x.total||(+x.ask||0)+(+x.ship||0);if(!market)return{...x,total,hasMarket:false,bestProfit:null,bestRoi:null,score:null};let ep=Math.round(market*.94),sp=Math.round(market*(1-(+s.subitoDiscount||0)/100)),ec=Math.round(ep*(+s.ebayFee||0)/100)+(+s.packing||0),sc=Math.round(sp*(+s.subitoFee||0)/100)+(+s.packing||0),e=ep-total-ec,q=sp-total-sc,er=total?e/total*100:0,qr=total?q/total*100:0,best=e>=q?'eBay':'Subito',bestProfit=Math.max(e,q),bestRoi=Math.max(er,qr),disc=(market-total)/market*100,pen=x.shippingVerified?0:8,score=Math.max(0,Math.min(100,Math.round(50+disc*1.2+bestRoi*.75-pen)));return{...x,total,hasMarket:true,ebayPrice:ep,subitoPrice:sp,eProfit:e,qProfit:q,eRoi:er,qRoi:qr,best,bestProfit,bestRoi,score}}
function allItems(){return(s.items||[]).map(calc).sort((a,b)=>(b.score??-1)-(a.score??-1))}
function qualifying(){return allItems().filter(x=>x.hasMarket&&x.bestProfit>=s.minProfit&&x.bestRoi>=s.minRoi)}
function navs(){let n=[['home','⌂ Home'],['discover','◎ Scopri offerte'],['search','⌕ Cerca prodotto'],['settings','⚙ Impostazioni']];document.getElementById('nav').innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');document.getElementById('bottom').innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){page=p;render()}
function head(t,sub){return`<div class="top"><div><div class="title">${t}</div><div class="sub">${sub}</div></div><div class="actions"><button class="btn" onclick="go('settings')">Configura</button></div></div>`}
function stats(){let a=allItems(),q=qualifying();return`<div class="grid stats"><div class="card stat"><div class="meta">Prodotti reali trovati</div><div class="val">${a.length}</div></div><div class="card stat"><div class="meta">Occasioni sopra soglia</div><div class="val good">${q.length}</div></div><div class="card stat"><div class="meta">Siti diversi</div><div class="val">${new Set(a.map(x=>x.domain)).size}</div></div><div class="card stat"><div class="meta">Profitto migliore</div><div class="val good">${q.length?euro(Math.max(...q.map(x=>x.bestProfit))):'—'}</div></div><div class="card stat"><div class="meta">Ultima scansione</div><div class="val" style="font-size:14px">${s.lastScan||'Mai'}</div></div></div>`}
function card(x){let pic=x.image?`<img class="pic" src="${x.image}" alt="">`:`<div class="pic">${icon(x.title)}</div>`;let qualify=x.hasMarket&&x.bestProfit>=s.minProfit&&x.bestRoi>=s.minRoi;let compare=x.hasMarket?`<div class="compare"><div class="box"><span>Compra a</span><b>${euro(x.total)}</b><div class="meta">${euro(x.ask)}${x.shippingVerified?' + '+euro(x.ship||0):' + sped. da verificare'}</div></div><div class="box${x.best==='eBay'?' best':''}"><span>Rivendi eBay</span><b>${euro(x.ebayPrice)}</b><div class="${x.eProfit>=0?'good':'bad'}">Utile ${euro(x.eProfit)}</div><div class="meta">ROI ${x.eRoi.toFixed(1)}%</div></div><div class="box${x.best==='Subito'?' best':''}"><span>Rivendi Subito</span><b>${euro(x.subitoPrice)}</b><div class="${x.qProfit>=0?'good':'bad'}">Utile ${euro(x.qProfit)}</div><div class="meta">ROI ${x.qRoi.toFixed(1)}%</div></div></div>`:`<div class="compare"><div class="box"><span>Compra a</span><b>${euro(x.total)}</b><div class="meta">${euro(x.ask)}${x.shippingVerified?' + '+euro(x.ship||0):' + sped. da verificare'}</div></div><div class="box"><span>Mercato</span><b>Da verificare</b><div class="warn">Comparabili insufficienti</div></div><div class="box"><span>Profitto</span><b>Non calcolabile</b><div class="meta">Serve una stima mercato affidabile</div></div></div>`;return`<div class="deal">${pic}<div><div class="name">${x.title}</div><span class="source">${x.source||x.domain}</span><div class="meta">Prezzo: ${x.priceSource||'web'} · campioni mercato: ${x.marketSamples||0}</div><div style="margin-top:5px"><span class="pill ${qualify?'ok':'maybe'}">${qualify?'OCCASIONE':'DA VALUTARE'}</span></div></div>${compare}<div><div class="score ${x.score==null?'unknown':''}">${x.score==null?'?':x.score}</div><div class="meta">${x.hasMarket?'Meglio: '+x.best:'mercato n/d'}</div><div class="da"><a class="mini open" href="${x.url}" target="_blank" rel="noopener">Apri prodotto</a></div></div></div>`}
function diag(){let d=s.stats||{};if(!s.stats)return'';return`<div class="card sec"><h3>Diagnostica scansione</h3><div class="grid diag"><div><div class="meta">Query Brave</div><div class="val">${d.queries??0}</div></div><div><div class="meta">Risultati ricerca</div><div class="val">${d.searchResults??0}</div></div><div><div class="meta">Pagine controllate</div><div class="val">${d.pagesChecked??0}</div></div><div><div class="meta">Prodotti estratti</div><div class="val">${d.productsParsed??0}</div></div></div></div>`}
function home(){let a=allItems().slice(0,8);view.innerHTML=head('Dashboard','Trova offerte su prodotti reali e cerca qualsiasi prodotto per nome.')+`<div class="banner"><b>V1.7</b> — I filtri non nascondono più i risultati: vedrai anche i prodotti trovati che non sono ancora un affare.</div><div class="searchbar"><input id="homeQ" placeholder="Cerca un prodotto: es. PS5 Slim, iPhone 15, Dyson V15"><button class="btn primary" onclick="searchFromHome()">Cerca prodotto</button><button class="btn" onclick="runDiscover()">Scopri offerte</button></div>`+stats()+diag()+`<div class="card sec"><h3>${s.mode==='search'?'Risultati per “'+escapeHtml(s.query)+'”':'Ultimi prodotti trovati'}</h3><div class="list">${a.length?a.map(card).join(''):'<div class="note">Premi “Scopri offerte” oppure cerca un prodotto specifico.</div>'}</div></div>`}
function discover(){let a=allItems();view.innerHTML=head('Scopri offerte','Ogni scansione ruota categorie diverse del web italiano.')+`<div class="actions" style="margin-bottom:16px"><button class="btn primary" onclick="runDiscover()">${busy?'Scansione in corso…':'Scopri nuove offerte'}</button></div>`+stats()+diag()+`<div class="card sec"><div class="list">${a.length?a.map(card).join(''):'<div class="note">Avvia la scansione. Verranno mostrati anche i prodotti senza stima di margine sufficiente.</div>'}</div></div>`}
function searchPage(){let a=allItems();view.innerHTML=head('Cerca prodotto','Scrivi qualsiasi prodotto e confrontiamo le pagine prodotto reali trovate sul web.')+`<div class="searchbar"><input id="searchQ" value="${escapeAttr(s.query||'')}" placeholder="es. Nintendo Switch OLED"><button class="btn primary" onclick="runProductSearch()">${busy?'Ricerca…':'Cerca'}</button></div>`+stats()+diag()+`<div class="card sec"><div class="list">${a.length?a.map(card).join(''):'<div class="note">Nessuna ricerca ancora.</div>'}</div></div>`}
function settings(){view.innerHTML=head('Impostazioni','Il Worker è già configurato; inserisci soltanto la tua SCANNER_KEY se manca.')+`<div class="card sec"><div class="field"><label>URL Cloudflare Worker</label><input id="endpoint" value="${escapeAttr(s.endpoint)}"></div><div class="field"><label>Scanner Access Key</label><input id="access" type="password" placeholder="SCANNER_KEY Cloudflare"></div><div class="field"><label>Capitale (€) — solo riferimento, non nasconde prodotti</label><input id="capital" type="number" value="${s.capital}"></div><div class="field"><label>Profitto minimo per badge OCCASIONE (€)</label><input id="minProfit" type="number" value="${s.minProfit}"></div><div class="field"><label>ROI minimo per badge OCCASIONE (%)</label><input id="minRoi" type="number" value="${s.minRoi}"></div><div class="field"><label>Costi eBay stimati (%)</label><input id="ebayFee" type="number" step="0.1" value="${s.ebayFee}"></div><div class="field"><label>Costi Subito stimati (%)</label><input id="subitoFee" type="number" step="0.1" value="${s.subitoFee}"></div><div class="field"><label>Imballaggio/altri costi (€)</label><input id="packing" type="number" value="${s.packing}"></div><div class="field"><label>Sconto target Subito vs mercato (%)</label><input id="subitoDiscount" type="number" value="${s.subitoDiscount}"></div><button class="btn primary" id="saveBtn" onclick="saveSettings()">Salva impostazioni</button><div id="saved" class="saved">Impostazioni salvate correttamente ✓</div></div>`}
function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(v){return escapeHtml(v)}
function saveSettings(){const g=id=>document.getElementById(id);s.endpoint=g('endpoint').value.trim().replace(/\/$/,'');s.capital=+g('capital').value||500;s.minProfit=+g('minProfit').value||0;s.minRoi=+g('minRoi').value||0;s.ebayFee=+g('ebayFee').value||0;s.subitoFee=+g('subitoFee').value||0;s.packing=+g('packing').value||0;s.subitoDiscount=+g('subitoDiscount').value||0;if(g('access').value)sessionStorage.setItem('dh17key',g('access').value);save();document.getElementById('saved').style.display='block';setTimeout(()=>{const e=document.getElementById('saved');if(e)e.style.display='none'},2200)}
function ensureReady(){if(!s.endpoint){go('settings');alert('Configura l’URL del Worker.');return false}if(!key()){go('settings');alert('Inserisci la SCANNER_KEY e premi Salva impostazioni.');return false}return true}
async function api(path,body){let r=await fetch(s.endpoint+path,{method:'POST',headers:{'content-type':'application/json','x-dealhunter-key':key()},body:JSON.stringify(body)});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j}
async function runDiscover(){if(busy||!ensureReady())return;busy=true;render();try{let j=await api('/discover',{offset:s.offset||0});s.items=j.items||[];s.stats=j.stats||null;s.mode='discover';s.query='';s.offset=((s.offset||0)+4)%12;s.lastScan=new Date().toLocaleString('it-IT');save();page='discover'}catch(e){alert('Scansione fallita: '+e.message)}finally{busy=false;render()}}
async function doSearch(q){if(busy||!ensureReady())return;q=String(q||'').trim();if(!q)return alert('Scrivi il prodotto da cercare.');busy=true;s.query=q;render();try{let j=await api('/search',{q});s.items=j.items||[];s.stats=j.stats||null;s.mode='search';s.query=q;s.lastScan=new Date().toLocaleString('it-IT');save();page='search'}catch(e){alert('Ricerca fallita: '+e.message)}finally{busy=false;render()}}
function searchFromHome(){doSearch(document.getElementById('homeQ').value)}function runProductSearch(){doSearch(document.getElementById('searchQ').value)}
function render(){navs();({home,discover,search:searchPage,settings}[page]||home)()}render();
</script></body></html>
