<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealHunter AI V1.13</title><style>
:root{--b:#07111f;--p:#0d1b2d;--p2:#10243c;--l:#1e3653;--t:#eff6ff;--m:#8da3bd;--g:#22c55e;--y:#f59e0b;--bl:#38bdf8;--r:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#050e19;border-right:1px solid var(--l);padding:18px 12px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:900;display:flex;gap:8px;align-items:center}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--g),var(--bl));display:grid;place-items:center;color:#00140a}.tag{margin-left:auto;background:#7bf1a8;color:#001b0e;border-radius:99px;padding:4px 7px;font-size:10px}.nav{display:grid;gap:6px;margin-top:24px}.nav button,.btn{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}.nav button{border:0;background:transparent;text-align:left;color:var(--m)}.nav button.active{background:var(--p2);color:#fff}.main{padding:24px}.top{display:flex;justify-content:space-between;gap:14px;margin-bottom:16px}.title{font-size:30px;font-weight:900}.sub,.meta,.note{color:var(--m);font-size:11px;line-height:1.45}.searchbar{display:flex;gap:8px;margin-bottom:16px}.searchbar input,.field input{background:#081827;color:#fff;border:1px solid var(--l);border-radius:11px;padding:12px;width:100%}.searchbar input{flex:1}.primary{background:linear-gradient(135deg,#16a34a,#0ea5e9);border:0}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:14px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:15px}.stat,.sec{padding:15px}.val{font-size:23px;font-weight:900;margin-top:4px}.banner{padding:12px 14px;border:1px solid #285948;border-radius:13px;background:#10283d;margin-bottom:14px}.group{margin-top:16px}.grouphead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}.grouphead h3{margin:0;font-size:18px}.list{display:grid;gap:10px}.deal{display:grid;grid-template-columns:58px minmax(220px,1.2fr) minmax(340px,1.6fr) auto;gap:12px;align-items:center;padding:13px;border:1px solid #203a5a;border-radius:14px;background:#0b1a2c}.deal.bestdeal{border-color:#2d8a55;box-shadow:0 0 0 1px #2d8a5533 inset}.pic{width:56px;height:56px;border-radius:10px;background:#071827;display:grid;place-items:center;font-size:24px;object-fit:cover}.name{font-weight:900}.source,.pill{display:inline-block;border-radius:99px;padding:4px 7px;font-size:10px;font-weight:900}.source{background:#15314b;border:1px solid #285675;margin-top:5px}.pill.ok{background:#154a2d;color:#8ff0b0}.pill.indexed{background:#173a64;color:#9edcff}.pill.warn{background:#493b15;color:#ffd66f}.pill.bad{background:#4b1f25;color:#ff9ca5}.pricegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.box{background:#071827;border:1px solid #1d3b5c;border-radius:10px;padding:9px}.box.best{border-color:#267348;background:#0d2d1e}.box span{display:block;color:var(--m);font-size:9px;text-transform:uppercase}.box b{display:block;margin-top:3px;font-size:15px}.good{color:#65e58c}.warntext{color:#ffc55d}.rank{width:46px;height:46px;border:3px solid #64748b;border-radius:50%;display:grid;place-items:center;font-weight:900}.rank.best{border-color:var(--g);color:#7bf1a8}.mini{display:block;margin-top:8px;border:1px solid var(--l);background:#173a64;color:#fff;border-radius:9px;padding:8px 9px;font-size:11px;font-weight:800;text-decoration:none;text-align:center}.diag{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}.models{margin-top:10px;padding:10px;border:1px dashed #2b4b70;border-radius:10px}.field{display:grid;gap:5px;margin-bottom:10px}.saved{display:none;color:#65e58c;font-weight:800;margin-top:10px}.bottom{display:none}@media(max-width:1200px){.deal{grid-template-columns:58px 1fr auto}.pricegrid{grid-column:1/-1}.diag{grid-template-columns:repeat(4,1fr)}}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{display:block}.side{display:none}.main{padding:15px 11px 76px}.top{display:block}.bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:#050e19;border-top:1px solid var(--l);padding:7px}.bottom button{border:0;background:transparent;color:var(--m);font-size:10px}.bottom button.active{color:#fff}.searchbar{display:grid}.pricegrid{grid-template-columns:repeat(2,1fr)}.diag{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">⌁</div>DealHunter AI <span class="tag">V1.13</span></div><div id="nav" class="nav"></div></aside><main class="main"><div id="view"></div></main></div><div id="bottom" class="bottom"></div><script>
'use strict';
const DEF={endpoint:'https://dealhunter-scanner.mulas-claudio88.workers.dev',items:[],stats:null,lastScan:'',query:'',offset:0};
let s=(()=>{try{return Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem('dh23')||'{}'))}catch{return structuredClone(DEF)}})(),page='home',busy=false;
const save=()=>localStorage.setItem('dh23',JSON.stringify(s)),key=()=>sessionStorage.getItem('dh23key')||sessionStorage.getItem('dh22key')||sessionStorage.getItem('dh21key')||'',esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),euro=v=>v==null||!Number.isFinite(+v)?'—':new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(+v);
function icon(t){return /iphone|samsung|pixel|smartphone/i.test(t)?'📱':/nintendo|playstation|switch|xbox|console/i.test(t)?'🎮':/rtx|radeon|geforce|gpu/i.test(t)?'🖥️':/macbook|notebook|laptop/i.test(t)?'💻':/tv|televis/i.test(t)?'📺':'📦'}
function all(){return s.items||[]}
function navs(){let n=[['home','⌂ Home'],['search','⌕ Confronta prezzi'],['discover','◎ Scopri offerte'],['settings','⚙ Impostazioni']];nav.innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');bottom.innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){page=p;render()}
function head(t,sub){return`<div class="top"><div><div class="title">${t}</div><div class="sub">${sub}</div></div><button class="btn" onclick="go('settings')">Configura</button></div>`}
function stats(){let a=all(),verified=a.filter(x=>x.priceVerified),stores=new Set(a.map(x=>x.domain)).size,lowest=verified.length?Math.min(...verified.map(x=>x.total)):null;return`<div class="grid stats"><div class="card stat"><div class="meta">Offerte trovate</div><div class="val">${a.length}</div></div><div class="card stat"><div class="meta">Prezzi verificati</div><div class="val good">${verified.length}</div></div><div class="card stat"><div class="meta">Negozi diversi</div><div class="val">${stores}</div></div><div class="card stat"><div class="meta">Più basso verificato</div><div class="val good">${lowest==null?'—':euro(lowest)}</div></div></div>`}
function sourceText(x){return x.priceSource==='PAGE_HERO_PRICE'?'Prezzo principale verificato nel blocco prodotto':x.priceSource==='PAGE_CORROBORATED_PRICE'?'Prezzo confermato da più dati della pagina':x.priceSource==='PAGE_PRODUCT_META_UNCONFIRMED'?'Prezzo meta pagina — da verificare':x.priceSource==='PAGE_PRODUCT_SCHEMA_UNCONFIRMED'?'Prezzo schema pagina — da verificare':x.priceSource==='BRAVE_PRODUCT_SCHEMA'?'Prezzo indicizzato — da verificare':'Prezzo web'}
function card(x){let best=!!x.bestVerified,indexed=!x.priceVerified,saving=x.market&&x.total?x.market-x.total:null,pic=x.image?`<img class="pic" src="${esc(x.image)}">`:`<div class="pic">${icon(x.title)}</div>`;return`<div class="deal ${best?'bestdeal':''}">${pic}<div><div class="name">${esc(x.title)}</div><span class="source">${esc(x.source||x.domain)}</span><div class="meta">${sourceText(x)}</div><div style="margin-top:6px">${best?'<span class="pill ok">MIGLIOR PREZZO VERIFICATO</span> ':''}${indexed?'<span class="pill indexed">DA VERIFICARE</span>':'<span class="pill ok">VERIFICATO</span>'}${!x.shippingVerified?' <span class="pill warn">SPEDIZIONE DA VERIFICARE</span>':''}${x.priceConflict?' <span class="pill bad">DATI PREZZO IN CONFLITTO</span>':''}</div></div><div class="pricegrid"><div class="box"><span>Prezzo</span><b>${euro(x.ask)}</b></div><div class="box"><span>Spedizione</span><b>${x.shippingVerified?euro(x.ship||0):'Da verificare'}</b></div><div class="box ${best?'best':''}"><span>${x.totalKnown?'Totale':'Minimo noto'}</span><b>${euro(x.total)}</b></div><div class="box"><span>Media offerte verificate</span><b>${x.market?euro(x.market):'—'}</b>${saving!=null?`<div class="${saving>0?'good':'warntext'}">${saving>0?'Risparmi ':'Sopra media '}${euro(Math.abs(saving))}</div>`:''}</div></div><div><div class="rank ${best?'best':''}">#${x.rank||'?'}</div><a class="mini" href="${esc(x.url)}" target="_blank" rel="noopener">Apri prodotto</a></div></div>`}
function groups(){let map=new Map();for(const x of all()){let k=x.modelQuery||s.query||'Risultati';if(!map.has(k))map.set(k,[]);map.get(k).push(x)}let html='';for(const [model,items] of map){items.sort((a,b)=>(a.rank||99)-(b.rank||99));html+=`<div class="group"><div class="grouphead"><h3>${esc(model)}</h3><div class="meta">${items.length} offerte trovate</div></div><div class="list">${items.map(card).join('')}</div></div>`}return html||'<div class="card sec"><div class="note">Nessuna offerta valida trovata.</div></div>'}
function diag(){let d=s.stats||{};if(!s.stats)return'';let models=d.expandedModels||[];return`<div class="card sec"><h3>Diagnostica</h3><div class="diag"><div><div class="meta">Query</div><div class="val">${d.queries??0}</div></div><div><div class="meta">Risultati web</div><div class="val">${d.searchResults??0}</div></div><div><div class="meta">Pagine controllate</div><div class="val">${d.pagesChecked??0}</div></div><div><div class="meta">Da pagina</div><div class="val">${d.pageParsed??0}</div></div><div><div class="meta">Da indice</div><div class="val">${d.indexFallback??0}</div></div><div><div class="meta">Non disponibili</div><div class="val">${d.rejectedUnavailable??0}</div></div><div><div class="meta">Conflitti prezzo</div><div class="val">${d.priceConflicts??0}</div></div><div><div class="meta">Offerte valide</div><div class="val">${d.productsParsed??0}</div></div></div>${models.length?`<div class="models"><b>${d.broadQuery?'Ricerca generica espansa in modelli concreti':'Prodotto cercato'}</b><div class="meta" style="margin-top:6px">${models.map(esc).join(' · ')}</div></div>`:''}</div>`}
function searchBlock(id='q'){return`<div class="searchbar"><input id="${id}" value="${esc(s.query)}" placeholder="Scrivi qualsiasi prodotto: es. Samsung S26 512GB, iPhone 17 256GB, Dyson V15"><button class="btn primary" onclick="doSearch(document.getElementById('${id}').value)">${busy?'Ricerca…':'Trova prezzi più bassi'}</button></div>`}
function home(){view.innerHTML=head('Trova il prezzo più basso','DealHunter verifica prima il prezzo nel blocco principale della scheda prodotto e mette in cima solo i prezzi realmente confermati.')+`<div class="banner"><b>V1.13 PRICE VERIFY</b> — Un numero presente nella pagina non basta più: per essere “VERIFICATO” deve essere il prezzo principale del prodotto o essere confermato da più segnali coerenti.</div>`+searchBlock('hq')+stats()+diag()+groups()}
function searchPage(){view.innerHTML=head('Confronta prezzi','Cerca un prodotto preciso o un termine più generico: DealHunter separa modelli diversi e ordina le offerte verificate.')+searchBlock('sq')+stats()+diag()+groups()}
function discover(){view.innerHTML=head('Scopri offerte','Scansione automatica; i prezzi non verificati non possono essere classificati come miglior prezzo verificato.')+`<div style="margin-bottom:14px"><button class="btn primary" onclick="runDiscover()">${busy?'Scansione…':'Scopri nuove offerte'}</button></div>`+stats()+diag()+groups()}
function settings(){view.innerHTML=head('Impostazioni','La SCANNER_KEY resta solo nella sessione del browser.')+`<div class="card sec"><div class="field"><label>URL Worker</label><input id="endpoint" value="${esc(s.endpoint)}"></div><div class="field"><label>Scanner Access Key</label><input id="access" type="password" placeholder="SCANNER_KEY Cloudflare"></div><button class="btn primary" onclick="saveSettings()">Salva</button><div id="saved" class="saved">Salvato ✓</div></div>`}
function saveSettings(){let g=id=>document.getElementById(id);s.endpoint=g('endpoint').value.trim().replace(/\/$/,'');if(g('access').value)sessionStorage.setItem('dh23key',g('access').value.trim());save();g('saved').style.display='block'}
function ready(){if(!s.endpoint)return false;if(!key()){let k=prompt('Inserisci la SCANNER_KEY di Cloudflare:');if(k)sessionStorage.setItem('dh23key',k.trim())}return!!key()}
async function api(path,body){let r=await fetch(s.endpoint+path,{method:'POST',headers:{'content-type':'application/json','x-dealhunter-key':key()},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.status);return j}
async function doSearch(q){q=String(q||'').trim();if(!q)return alert('Scrivi cosa vuoi cercare.');if(busy||!ready())return;busy=true;s.query=q;render();try{let j=await api('/search',{q});s.items=j.items||[];s.stats=j.stats||null;s.query=q;s.lastScan=new Date().toLocaleString('it-IT');save();page='search'}catch(e){alert('Ricerca fallita: '+e.message)}finally{busy=false;render()}}
async function runDiscover(){if(busy||!ready())return;busy=true;render();try{let j=await api('/discover',{offset:s.offset});s.items=j.items||[];s.stats=j.stats||null;s.offset=(s.offset+1)%12;s.query='';s.lastScan=new Date().toLocaleString('it-IT');save();page='discover'}catch(e){alert('Scansione fallita: '+e.message)}finally{busy=false;render()}}
function render(){navs();({home,search:searchPage,discover,settings}[page]||home)()}render();
</script></body></html>
