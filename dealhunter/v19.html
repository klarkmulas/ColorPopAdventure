<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealHunter AI V1.9</title><style>
:root{--b:#07111f;--p:#0d1b2d;--p2:#10243c;--l:#1e3653;--t:#eff6ff;--m:#8da3bd;--g:#22c55e;--y:#f59e0b;--r:#ef4444;--bl:#38bdf8}*{box-sizing:border-box}body{margin:0;background:#07111f;color:var(--t);font:14px system-ui}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#050e19;border-right:1px solid var(--l);padding:18px 12px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--g),var(--bl));display:grid;place-items:center;color:#00140a}.tag{margin-left:auto;background:#7bf1a8;color:#001b0e;border-radius:99px;padding:4px 7px;font-size:10px}.nav{display:grid;gap:6px;margin-top:24px}.nav button,.btn{border:1px solid var(--l);background:var(--p2);color:white;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}.nav button{border:0;background:transparent;text-align:left;color:var(--m)}.nav button.active{background:var(--p2);color:#fff}.main{padding:24px}.top{display:flex;justify-content:space-between;gap:14px;margin-bottom:16px}.title{font-size:30px;font-weight:900}.sub,.meta,.note{color:var(--m);font-size:11px;line-height:1.45}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(5,1fr);margin-bottom:14px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:15px}.sec,.stat{padding:15px}.val{font-size:23px;font-weight:900;margin-top:4px}.banner{padding:12px 14px;border:1px solid #285948;border-radius:13px;background:#10283d;margin-bottom:14px}.searchbar{display:flex;gap:8px;margin-bottom:15px}.searchbar input,.field input{background:#081827;color:#fff;border:1px solid var(--l);border-radius:10px;padding:11px;width:100%}.searchbar input{flex:1}.list{display:grid;gap:10px}.deal{display:grid;grid-template-columns:62px 1.2fr 1.8fr auto;gap:12px;align-items:center;padding:12px;border:1px solid #203a5a;border-radius:13px;background:#0b1a2c}.pic{width:58px;height:58px;border-radius:10px;background:#071827;display:grid;place-items:center;font-size:25px;object-fit:cover}.name{font-weight:900}.source,.pill{display:inline-block;border-radius:99px;padding:4px 7px;font-size:10px;font-weight:900}.source{background:#15314b;border:1px solid #285675;margin-top:5px}.ok{background:#154a2d;color:#8ff0b0}.maybe{background:#493b15;color:#ffd66f}.indexed{background:#173a64;color:#9edcff}.compare{display:grid;grid-template-columns:.9fr 1.1fr 1.1fr;gap:7px}.box{background:#071827;border:1px solid #1d3b5c;border-radius:10px;padding:8px}.box.best{border-color:#267348;background:#0d2d1e}.box span{display:block;color:var(--m);font-size:9px;text-transform:uppercase}.box b{display:block;margin-top:3px}.good{color:#65e58c}.bad{color:#ff7c86}.warn{color:#ffc55d}.score{width:44px;height:44px;border:4px solid var(--g);border-radius:50%;display:grid;place-items:center;font-weight:900}.score.unknown{border-color:#64748b;color:#94a3b8}.mini{display:inline-block;margin-top:7px;border:1px solid var(--l);background:#173a64;color:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:800;text-decoration:none}.diag{grid-template-columns:repeat(6,1fr)}.field{display:grid;gap:5px;margin-bottom:10px}.saved{display:none;color:#65e58c;font-weight:800;margin-top:10px}.bottom{display:none}@media(max-width:1100px){.stats,.diag{grid-template-columns:repeat(2,1fr)}.deal{grid-template-columns:58px 1fr auto}.compare{grid-column:1/-1}}@media(max-width:700px){.app{display:block}.side{display:none}.main{padding:15px 11px 76px}.top{display:block}.bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:#050e19;border-top:1px solid var(--l);padding:7px}.bottom button{border:0;background:transparent;color:var(--m);font-size:10px}.bottom button.active{color:#fff}.compare{grid-template-columns:1fr}.searchbar{display:grid}.deal .mini{grid-column:1/-1}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">⌁</div>DealHunter AI <span class="tag">V1.9</span></div><div id="nav" class="nav"></div></aside><main class="main"><div id="view"></div></main></div><div id="bottom" class="bottom"></div><script>
'use strict';
const DEF={endpoint:'https://dealhunter-scanner.mulas-claudio88.workers.dev',items:[],stats:null,lastScan:'',mode:'',query:'',offset:0,minProfit:25,minRoi:10,ebayFee:0,subitoFee:0,packing:5,subitoDiscount:7};
let s=(()=>{try{return Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem('dh18')||'{}'))}catch{return structuredClone(DEF)}})(),page='home',busy=false;
const save=()=>localStorage.setItem('dh18',JSON.stringify(s));const key=()=>sessionStorage.getItem('dh18key')||sessionStorage.getItem('dh17key')||sessionStorage.getItem('dh16key')||'';const euro=v=>v==null||!Number.isFinite(+v)?'—':new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(+v);const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icon(t){return /iphone|samsung|pixel|smartphone/i.test(t)?'📱':/playstation|switch|xbox|console/i.test(t)?'🎮':/rtx|radeon|geforce|gpu/i.test(t)?'🖥️':/macbook|notebook|laptop/i.test(t)?'💻':/camera|fotocamera|sony|canon|nikon/i.test(t)?'📷':'📦'}
function calc(x){let total=+x.total||(+x.ask||0)+(+x.ship||0),market=+x.market||0;if(!market)return{...x,total,hasMarket:false,score:null,bestProfit:null,bestRoi:null};let ep=Math.round(market*.94*100)/100,sp=Math.round(market*(1-(+s.subitoDiscount||0)/100)*100)/100,ec=ep*(+s.ebayFee||0)/100+(+s.packing||0),sc=sp*(+s.subitoFee||0)/100+(+s.packing||0),e=ep-total-ec,q=sp-total-sc,er=total?e/total*100:0,qr=total?q/total*100:0,best=e>=q?'eBay':'Subito',bestProfit=Math.max(e,q),bestRoi=Math.max(er,qr),score=Math.max(0,Math.min(100,Math.round(50+((market-total)/market*100)*1.2+bestRoi*.75-(x.shippingVerified?0:8))));return{...x,total,hasMarket:true,ebayPrice:ep,subitoPrice:sp,eProfit:e,qProfit:q,eRoi:er,qRoi:qr,best,bestProfit,bestRoi,score}}
function all(){return(s.items||[]).map(calc).sort((a,b)=>(b.score??-1)-(a.score??-1))}function good(){return all().filter(x=>x.hasMarket&&x.bestProfit>=s.minProfit&&x.bestRoi>=s.minRoi)}
function navs(){let n=[['home','⌂ Home'],['discover','◎ Scopri offerte'],['search','⌕ Cerca prodotto'],['settings','⚙ Impostazioni']];nav.innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');bottom.innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function go(p){page=p;render()}function head(t,sub){return`<div class="top"><div><div class="title">${t}</div><div class="sub">${sub}</div></div><button class="btn" onclick="go('settings')">Configura</button></div>`}
function stats(){let a=all(),g=good();return`<div class="grid stats"><div class="card stat"><div class="meta">Prodotti trovati</div><div class="val">${a.length}</div></div><div class="card stat"><div class="meta">Occasioni</div><div class="val good">${g.length}</div></div><div class="card stat"><div class="meta">Siti diversi</div><div class="val">${new Set(a.map(x=>x.domain)).size}</div></div><div class="card stat"><div class="meta">Profitto migliore</div><div class="val good">${g.length?euro(Math.max(...g.map(x=>x.bestProfit))):'—'}</div></div><div class="card stat"><div class="meta">Ultima scansione</div><div class="val" style="font-size:13px">${s.lastScan||'Mai'}</div></div></div>`}
function sourceText(x){if(x.priceSource==='PAGE_PRODUCT_SCHEMA')return'Prezzo verificato dalla scheda prodotto';if(x.priceSource==='PAGE_PRODUCT_META')return'Prezzo dalla pagina prodotto';if(x.priceSource==='BRAVE_PRODUCT_SCHEMA')return'Prezzo prodotto indicizzato da Brave';return x.priceSource||'web'}
function card(x){let qualify=x.hasMarket&&x.bestProfit>=s.minProfit&&x.bestRoi>=s.minRoi,indexed=String(x.priceSource||'').startsWith('BRAVE_'),pic=x.image?`<img class="pic" src="${esc(x.image)}">`:`<div class="pic">${icon(x.title)}</div>`;let cmp=x.hasMarket?`<div class="compare"><div class="box"><span>Compra a</span><b>${euro(x.total)}</b><div class="meta">${euro(x.ask)}${x.shippingVerified?' + '+euro(x.ship||0):' + spedizione da verificare'}</div></div><div class="box${x.best==='eBay'?' best':''}"><span>Target eBay</span><b>${euro(x.ebayPrice)}</b><div class="${x.eProfit>=0?'good':'bad'}">Utile stim. ${euro(x.eProfit)}</div><div class="meta">ROI ${x.eRoi.toFixed(1)}%</div></div><div class="box${x.best==='Subito'?' best':''}"><span>Target Subito</span><b>${euro(x.subitoPrice)}</b><div class="${x.qProfit>=0?'good':'bad'}">Utile stim. ${euro(x.qProfit)}</div><div class="meta">ROI ${x.qRoi.toFixed(1)}%</div></div></div>`:`<div class="compare"><div class="box"><span>Prezzo trovato</span><b>${euro(x.total)}</b></div><div class="box"><span>Mercato</span><b>Non sufficiente</b><div class="warn">Servono prezzi comparabili</div></div><div class="box"><span>Margine</span><b>Non calcolabile</b></div></div>`;return`<div class="deal">${pic}<div><div class="name">${esc(x.title)}</div><span class="source">${esc(x.source||x.domain)}</span><div class="meta">${sourceText(x)} · campioni mercato ${x.marketSamples||0}</div><div style="margin-top:5px"><span class="pill ${qualify?'ok':'maybe'}">${qualify?'OCCASIONE':'DA VALUTARE'}</span>${indexed?' <span class="pill indexed">INDICIZZATO</span>':''}</div></div>${cmp}<div><div class="score ${x.score==null?'unknown':''}">${x.score==null?'?':x.score}</div><div class="meta">${x.hasMarket?'Meglio: '+x.best:'mercato n/d'}</div><a class="mini" href="${esc(x.url)}" target="_blank" rel="noopener">Apri prodotto esatto</a></div></div>`}
function diag(){let d=s.stats||{};if(!s.stats)return'';return`<div class="card sec"><h3>Diagnostica</h3><div class="grid diag"><div><div class="meta">Query Brave</div><div class="val">${d.queries??0}</div></div><div><div class="meta">Risultati</div><div class="val">${d.searchResults??0}</div></div><div><div class="meta">Scartati generici</div><div class="val">${d.rejectedGeneric??0}</div></div><div><div class="meta">Da pagina prodotto</div><div class="val">${d.pageParsed??0}</div></div><div><div class="meta">Da indice prodotto</div><div class="val">${d.indexFallback??0}</div></div><div><div class="meta">Prodotti validi</div><div class="val">${d.productsParsed??0}</div></div></div></div>`}
function listBlock(){let a=all();return`<div class="card sec"><div class="list">${a.length?a.map(card).join(''):'<div class="note">Nessun prodotto specifico valido trovato. Le pagine generiche vengono scartate apposta per evitare falsi prezzi e falsi affari.</div>'}</div></div>`}
function home(){view.innerHTML=head('Dashboard','Ricerca prodotti specifici sul web italiano con controllo anti-pagine-generiche.')+`<div class="banner"><b>V1.9 STRICT</b> — Scarta pagine di ricerca/categoria e confronta ogni articolo solo con lo stesso prodotto. Niente prezzi presi da numeri casuali nella pagina.</div><div class="searchbar"><input id="hq" placeholder="es. iPhone 15 128GB, Dyson V15, PS5 Slim"><button class="btn primary" onclick="doSearch(hq.value)">Cerca prodotto</button><button class="btn" onclick="runDiscover()">Scopri offerte</button></div>`+stats()+diag()+listBlock()}
function discover(){view.innerHTML=head('Scopri offerte','Ruota categorie diverse e cerca offerte indicizzate in Italia.')+`<div style="margin-bottom:14px"><button class="btn primary" onclick="runDiscover()">${busy?'Scansione in corso…':'Scopri nuove offerte'}</button></div>`+stats()+diag()+listBlock()}
function searchPage(){view.innerHTML=head('Cerca prodotto','Scrivi qualsiasi prodotto: vedrai pagine precise, non liste generiche.')+`<div class="searchbar"><input id="sq" value="${esc(s.query)}" placeholder="es. Nintendo Switch OLED"><button class="btn primary" onclick="doSearch(sq.value)">${busy?'Ricerca…':'Cerca'}</button></div>`+stats()+diag()+listBlock()}
function settings(){view.innerHTML=head('Impostazioni','La SCANNER_KEY resta solo nella sessione del browser.')+`<div class="card sec"><div class="field"><label>URL Worker</label><input id="endpoint" value="${esc(s.endpoint)}"></div><div class="field"><label>Scanner Access Key</label><input id="access" type="password" placeholder="SCANNER_KEY Cloudflare"></div><div class="field"><label>Profitto minimo badge OCCASIONE (€)</label><input id="minProfit" type="number" value="${s.minProfit}"></div><div class="field"><label>ROI minimo badge OCCASIONE (%)</label><input id="minRoi" type="number" value="${s.minRoi}"></div><div class="field"><label>Costi eBay stimati (%)</label><input id="ebayFee" type="number" step="0.1" value="${s.ebayFee}"></div><div class="field"><label>Costi Subito stimati (%)</label><input id="subitoFee" type="number" step="0.1" value="${s.subitoFee}"></div><div class="field"><label>Imballaggio/altri costi (€)</label><input id="packing" type="number" value="${s.packing}"></div><div class="field"><label>Sconto target Subito vs mercato (%)</label><input id="subitoDiscount" type="number" value="${s.subitoDiscount}"></div><button class="btn primary" onclick="saveSettings()">Salva impostazioni</button><div id="saved" class="saved">Salvato ✓</div></div>`}
function saveSettings(){let g=id=>document.getElementById(id);s.endpoint=g('endpoint').value.trim().replace(/\/$/,'');s.minProfit=+g('minProfit').value||0;s.minRoi=+g('minRoi').value||0;s.ebayFee=+g('ebayFee').value||0;s.subitoFee=+g('subitoFee').value||0;s.packing=+g('packing').value||0;s.subitoDiscount=+g('subitoDiscount').value||0;if(g('access').value)sessionStorage.setItem('dh18key',g('access').value);save();g('saved').style.display='block'}
function ready(){if(!s.endpoint||!key()){go('settings');alert('Inserisci la SCANNER_KEY e salva.');return false}return true}async function api(path,body){let r=await fetch(s.endpoint+path,{method:'POST',headers:{'content-type':'application/json','x-dealhunter-key':key()},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.status);return j}
async function runDiscover(){if(busy||!ready())return;busy=true;render();try{let j=await api('/discover',{offset:s.offset});s.items=j.items||[];s.stats=j.stats||null;s.mode='discover';s.query='';s.offset=(s.offset+4)%12;s.lastScan=new Date().toLocaleString('it-IT');save();page='discover'}catch(e){alert('Scansione fallita: '+e.message)}finally{busy=false;render()}}
async function doSearch(q){q=String(q||'').trim();if(!q)return alert('Scrivi un prodotto.');if(busy||!ready())return;busy=true;s.query=q;render();try{let j=await api('/search',{q});s.items=j.items||[];s.stats=j.stats||null;s.mode='search';s.lastScan=new Date().toLocaleString('it-IT');save();page='search'}catch(e){alert('Ricerca fallita: '+e.message)}finally{busy=false;render()}}
function render(){navs();({home,discover,search:searchPage,settings}[page]||home)()}render();
</script></body></html>
