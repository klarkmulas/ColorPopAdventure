<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealHunter AI V1.6</title><style>:root{--b:#07111f;--p:#0d1b2d;--p2:#10243c;--l:#1e3653;--t:#eff6ff;--m:#8da3bd;--g:#22c55e;--r:#ef4444;--y:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:20px 14px;background:#050e19;border-right:1px solid var(--l);position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:900;display:flex;gap:9px;align-items:center}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--g),#38bdf8);display:grid;place-items:center;color:#02120a}.tag{margin-left:auto;font-size:10px;background:#7bf1a8;color:#001b0e;padding:4px 7px;border-radius:99px}.nav{display:grid;gap:6px;margin-top:24px}.nav button,.btn{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:11px;padding:10px 12px;font-weight:800;cursor:pointer}.nav button{border:0;background:transparent;text-align:left;color:var(--m)}.nav button.active{background:var(--p2);color:#fff}.foot{position:absolute;bottom:18px;color:var(--m);font-size:11px}.main{padding:26px}.top{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}.title{font-size:30px;font-weight:900}.sub,.meta,.note{color:var(--m);font-size:11px;line-height:1.45}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{border:0;background:linear-gradient(135deg,#16a34a,#0ea5e9)}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(5,1fr);margin-bottom:16px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:16px}.stat,.sec{padding:16px}.val{font-size:24px;font-weight:900;margin-top:4px}.banner{padding:13px 15px;border:1px solid #285948;border-radius:14px;background:#10283d;margin-bottom:16px}.list{display:grid;gap:10px}.deal{display:grid;grid-template-columns:64px 1.25fr 1.9fr auto;gap:12px;align-items:center;padding:13px;border:1px solid #203a5a;border-radius:14px;background:#0b1a2c}.pic{width:60px;height:60px;border-radius:11px;background:#071827;display:grid;place-items:center;font-size:26px;object-fit:cover}.name{font-weight:900}.source{display:inline-block;margin-top:5px;padding:4px 7px;border-radius:99px;background:#15314b;border:1px solid #285675;font-size:10px;font-weight:800}.compare{display:grid;grid-template-columns:.9fr 1.1fr 1.1fr;gap:7px}.box{background:#071827;border:1px solid #1d3b5c;border-radius:10px;padding:8px}.box.best{border-color:#267348;background:#0d2d1e}.box span{display:block;color:var(--m);font-size:9px;text-transform:uppercase}.box b{display:block;margin-top:3px}.good{color:#65e58c}.bad{color:#ff7c86}.warn{color:#ffc55d}.score{width:45px;height:45px;border:4px solid var(--g);border-radius:50%;display:grid;place-items:center;font-weight:900}.da{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.mini{border:1px solid var(--l);background:var(--p2);color:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:800;text-decoration:none;cursor:pointer}.open{background:#173a64}.field{display:grid;gap:5px;margin-bottom:10px}.field input,.field textarea{background:#081827;color:#fff;border:1px solid var(--l);border-radius:10px;padding:10px;width:100%}.field textarea{min-height:140px;resize:vertical}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #1a314c}.sourcegrid{grid-template-columns:repeat(2,1fr)}.status{display:inline-block;padding:4px 7px;border-radius:99px;font-size:10px;font-weight:900}.on{background:#154a2d;color:#8ff0b0}.pending{background:#493b15;color:#ffd66f}.manual{background:#3b304f;color:#d5b7ff}.bottom{display:none}@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.deal{grid-template-columns:60px 1fr auto}.compare{grid-column:1/-1}.sourcegrid{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}.side{display:none}.main{padding:16px 12px 78px}.top{display:block}.actions{margin-top:12px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#050e19;border-top:1px solid var(--l);padding:7px}.bottom button{border:0;background:transparent;color:var(--m);font-size:10px}.bottom button.active{color:#fff}.compare{grid-template-columns:1fr}.deal .da{grid-column:1/-1}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">⌁</div>DealHunter AI <span class="tag">WEB</span></div><div id="nav" class="nav"></div><div class="foot">V1.6 · Web Scanner STRICT<br>Solo URL prodotto precisi.</div></aside><main class="main"><div id="view"></div></main></div><div id="bottom" class="bottom"></div><script>'use strict';const DEF={endpoint:'',terms:['iPhone 13 128GB','iPhone 14 128GB','PlayStation 5 Slim Disc','Nintendo Switch OLED','RTX 4070 12GB','MacBook Air M1 256GB'],items:[],lastScan:'',capital:500,minProfit:25,minRoi:10,maxBuy:500,ebayFee:0,subitoFee:0,packing:5,subitoDiscount:7};let s=(()=>{try{return Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem('dh16')||'{}'))}catch{return structuredClone(DEF)}})(),page='home',busy=false;const save=()=>localStorage.setItem('dh16',JSON.stringify(s)),euro=v=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0),key=()=>sessionStorage.getItem('dh16key')||'',icon=t=>/iphone|samsung|pixel/i.test(t)?'📱':/playstation|switch|xbox|steam/i.test(t)?'🎮':/rtx|radeon|geforce/i.test(t)?'🖥️':/macbook|notebook|laptop/i.test(t)?'💻':'📦';function calc(x){let market=+x.market||0,total=+x.total||0,ep=Math.round(market*.94),sp=Math.round(market*(1-(+s.subitoDiscount||0)/100)),ec=Math.round(ep*(+s.ebayFee||0)/100)+(+s.packing||0),sc=Math.round(sp*(+s.subitoFee||0)/100)+(+s.packing||0),e=ep-total-ec,q=sp-total-sc,er=total?e/total*100:0,qr=total?q/total*100:0,best=e>=q?'eBay':'Subito',bestProfit=Math.max(e,q),bestRoi=Math.max(er,qr),disc=market?((market-total)/market*100):0,pen=x.shippingVerified?0:8,score=Math.max(0,Math.min(100,Math.round(50+disc*1.2+bestRoi*.75-pen)));return{...x,ebayPrice:ep,subitoPrice:sp,eProfit:e,qProfit:q,eRoi:er,qRoi:qr,best,bestProfit,bestRoi,score}}function items(){return(s.items||[]).map(calc).filter(x=>x.url&&x.ask&&x.total<=s.maxBuy&&x.bestProfit>=s.minProfit&&x.bestRoi>=s.minRoi).sort((a,b)=>b.score-a.score)}function navs(){let n=[['home','⌂ Home'],['scan','◎ Web Scanner'],['sources','⌁ Sorgenti'],['watch','★ Monitorati'],['settings','⚙ Impostazioni']];nav.innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');bottom.innerHTML=n.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function go(p){page=p;render()}function head(t,sub){return`<div class="top"><div><div class="title">${t}</div><div class="sub">${sub}</div></div><div class="actions"><button class="btn" onclick="go('settings')">Configura</button><button class="btn primary" onclick="runScan()" ${busy?'disabled':''}>${busy?'Scansione…':'Scansiona web'}</button></div></div>`}function stats(){let a=items();return`<div class="grid stats"><div class="card stat"><div class="meta">Offerte valide</div><div class="val">${a.length}</div></div><div class="card stat"><div class="meta">Siti diversi</div><div class="val">${new Set(a.map(x=>x.domain)).size}</div></div><div class="card stat"><div class="meta">Profitto migliore</div><div class="val good">${a.length?euro(Math.max(...a.map(x=>x.bestProfit))):'—'}</div></div><div class="card stat"><div class="meta">Ultima scansione</div><div class="val" style="font-size:15px">${s.lastScan||'Mai'}</div></div><div class="card stat"><div class="meta">Backend</div><div class="val" style="font-size:15px">${s.endpoint?'Configurato':'Da configurare'}</div></div></div>`}function card(x){let be=x.best==='eBay'?' best':'',bs=x.best==='Subito'?' best':'',pic=x.image?`<img class="pic" src="${x.image}" alt="">`:`<div class="pic">${icon(x.title)}</div>`;return`<div class="deal">${pic}<div><div class="name">${x.title}</div><span class="source">${x.source||x.domain}</span><div class="meta">Prezzo: ${x.priceSource||'web'} · mercato: ${x.marketSource||'n/d'}</div><div class="meta">Spedizione: ${x.shippingVerified?euro(x.ship||0):'da verificare'}</div></div><div class="compare"><div class="box"><span>Compra a</span><b>${euro(x.total)}</b><div class="meta">${euro(x.ask)} ${x.shippingVerified?' + '+euro(x.ship||0):' + sped. ?'}</div></div><div class="box${be}"><span>Rivendi eBay</span><b>${euro(x.ebayPrice)}</b><div class="good">Utile ${euro(x.eProfit)}</div><div class="meta">ROI ${x.eRoi.toFixed(1)}%</div></div><div class="box${bs}"><span>Rivendi Subito</span><b>${euro(x.subitoPrice)}</b><div class="good">Utile ${euro(x.qProfit)}</div><div class="meta">ROI ${x.qRoi.toFixed(1)}%</div></div></div><div><div class="score">${x.score}</div><div class="meta">Meglio: ${x.best}</div><div class="da"><a class="mini open" href="${x.url}" target="_blank" rel="noopener">Apri offerta specifica</a></div></div></div>`}function home(){let a=items().slice(0,8);view.innerHTML=head('Dashboard','Cerca offerte vere su siti che vendono in Italia e mostra solo URL prodotto precisi.')+`<div class="banner"><b>STRICT WEB</b> — niente risultati di ricerca generici: se non c’è pagina prodotto + prezzo verificabile, non appare come offerta.</div>`+stats()+`<div class="card sec"><h3>🔥 Migliori occasioni</h3><div class="list">${a.length?a.map(card).join(''):'<div class="note">Nessuna offerta ancora. Configura il backend e avvia una scansione.</div>'}</div></div>`}function scan(){let a=items();view.innerHTML=head('Web Scanner','Ricerca multi-sito reale, ordinata per margine e Deal Score.')+stats()+`<div class="card sec"><div class="list">${a.length?a.map(card).join(''):'<div class="note">Nessun risultato che superi i filtri.</div>'}</div></div>`}function sources(){view.innerHTML=head('Sorgenti','Come DealHunter copre il web.')+`<div class="grid sourcegrid"><div class="card sec"><h3>🌐 Web indicizzato</h3><span class="status on">LIVE via Brave</span><p class="note">Scopre pagine prodotto da negozi e retailer indicizzati. DealHunter prova a verificare prezzo e URL dalla pagina prodotto.</p></div><div class="card sec"><h3>eBay Italia</h3><span class="status on">API opzionale</span><p class="note">Usato come riferimento di mercato e per trovare annunci specifici sottoprezzati quando sono configurate le credenziali.</p></div><div class="card sec"><h3>Amazon.it</h3><span class="status pending">API dedicata</span><p class="note">Non viene finto tramite ricerca generica. Per Amazon completo serve il connettore Creators API dedicato.</p></div><div class="card sec"><h3>Subito</h3><span class="status manual">RIVENDITA</span><p class="note">DealHunter stima il target Subito; niente scraping automatico.</p></div></div>`}function watch(){view.innerHTML=head('Prodotti monitorati','Il web è enorme: scegliamo cosa cercare, ma lo cerchiamo su tutti i siti compatibili.')+`<div class="card sec"><div class="field"><label>Uno per riga · max 6 per scansione sul backend gratuito</label><textarea id="terms">${s.terms.join('\n')}</textarea></div><button class="btn primary" onclick="saveWatch()">Salva monitorati</button></div>`}function settings(){view.innerHTML=head('Impostazioni','Backend sicuro + filtri economici.')+`<div class="card sec"><div class="field"><label>URL Cloudflare Worker</label><input id="endpoint" value="${s.endpoint}" placeholder="https://dealhunter.nome.workers.dev"></div><div class="field"><label>Scanner Access Key (resta solo in questa sessione)</label><input id="access" type="password" placeholder="chiave che scegli tu"></div><div class="field"><label>Capitale (€)</label><input id="capital" type="number" value="${s.capital}"></div><div class="field"><label>Prezzo acquisto massimo (€)</label><input id="maxBuy" type="number" value="${s.maxBuy}"></div><div class="field"><label>Profitto minimo (€)</label><input id="minProfit" type="number" value="${s.minProfit}"></div><div class="field"><label>ROI minimo (%)</label><input id="minRoi" type="number" value="${s.minRoi}"></div><div class="field"><label>Costi eBay stimati (%)</label><input id="ebayFee" type="number" step="0.1" value="${s.ebayFee}"></div><div class="field"><label>Costi Subito stimati (%)</label><input id="subitoFee" type="number" step="0.1" value="${s.subitoFee}"></div><div class="field"><label>Imballaggio/altri costi (€)</label><input id="packing" type="number" value="${s.packing}"></div><div class="field"><label>Sconto target Subito vs mercato (%)</label><input id="subitoDiscount" type="number" value="${s.subitoDiscount}"></div><button class="btn primary" onclick="saveSettings()">Salva</button></div>`}function saveWatch(){s.terms=terms.value.split('\n').map(x=>x.trim()).filter(Boolean);save();render()}function saveSettings(){s.endpoint=endpoint.value.trim().replace(/\/$/,'');s.capital=+capital.value||500;s.maxBuy=+maxBuy.value||99999;s.minProfit=+minProfit.value||0;s.minRoi=+minRoi.value||0;s.ebayFee=+ebayFee.value||0;s.subitoFee=+subitoFee.value||0;s.packing=+packing.value||0;s.subitoDiscount=+subitoDiscount.value||0;if(access.value)sessionStorage.setItem('dh16key',access.value);save();render()}async function runScan(){if(busy)return;if(!s.endpoint){page='settings';render();return alert('Configura prima l’URL del backend.')}if(!key())return alert('Inserisci la Scanner Access Key in Impostazioni.');busy=true;render();try{let r=await fetch(s.endpoint+'/scan',{method:'POST',headers:{'content-type':'application/json','x-dealhunter-key':key()},body:JSON.stringify({terms:s.terms.slice(0,6)})});let j=await r.json();if(!r.ok)throw Error(j.error||r.status);s.items=j.items||[];s.lastScan=new Date().toLocaleString('it-IT');save();page='scan'}catch(e){alert('Scansione fallita: '+e.message)}finally{busy=false;render()}}function render(){navs();({home,scan,sources,watch,settings}[page]||home)()}render();</script></body></html>
